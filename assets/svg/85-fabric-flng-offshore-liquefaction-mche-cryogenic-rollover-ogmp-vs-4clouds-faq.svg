  <text x="176" y="242" fill="#38BDF8" font-size="11.5" font-weight="700">• series_fit_line() 3ms 锁定：Tank-04 上下层密度差缩至 0.35kg/m³ (即将翻滚) + MCHE-Train-2 重烃凝华压差 +2.4kPa/min</text>

