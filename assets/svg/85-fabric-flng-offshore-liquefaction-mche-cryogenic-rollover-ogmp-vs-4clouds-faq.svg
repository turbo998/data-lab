  <text x="176" y="304" fill="#CBD5E1" font-size="11.5">• 检索 1.76 亿条 GERG-2008 混合冷剂热力学相图、6-DoF 液舱晃荡水动力载荷谱与 BOG 防喘振向量 (0.99 相似，仅 $2,010/月)</text>
