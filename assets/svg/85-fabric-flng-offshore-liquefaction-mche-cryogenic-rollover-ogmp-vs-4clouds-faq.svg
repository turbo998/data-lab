  <text x="176" y="382" fill="#CBD5E1" font-size="11.5">• 强制核验《FLNG-MCHE-CRYOGENIC-ROLLOVER-OGMP-SOP-084》：确认上下层密度差归零至 0.02kg/m³ &lt;= 0.15kg/m³，舱压稳在 14.2kPag</text>
  <text x="176" y="398" fill="#C084FC" font-size="11.5" font-weight="700">• 确认 MCHE 压差回落至 18.5kPa &lt;= 25.0kPa，且全船甲烷逃逸率 0.038% &lt;= 0.20% (0.0kg 常规冷放空)，符合欧盟进口新规</text>

