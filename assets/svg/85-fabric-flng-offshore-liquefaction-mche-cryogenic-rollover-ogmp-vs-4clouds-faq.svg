  <text x="176" y="206" fill="#F8FAFC" font-size="13" font-weight="800">Eventhouse KQL 930K EPS 垂直 FBG 密度剖面、MCHE 微通道压差与 6-DoF 晃荡流感知 ($0/GB 写入税)</text>
