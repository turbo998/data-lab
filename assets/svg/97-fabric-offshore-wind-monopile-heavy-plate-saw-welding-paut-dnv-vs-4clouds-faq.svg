  <!-- Left Column: Problem & Legacy Bottleneck -->
  <rect x="28" y="136" width="490" height="390" rx="14" fill="url(#card97)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="48" y="168" font-size="18" font-weight="800" fill="#f87171">1. Why 48h Post-Weld Cold NDT &amp; Lookup Bending Fail Monopiles</text>
  <text x="48" y="196" font-size="13" font-weight="700" fill="#fca5a5">• 120mm Narrow-Gap SAW t8/5 Cold Cracking &amp; Buried LoF:</text>
  <text x="60" y="216" font-size="12" fill="#cbd5e1">When Pass-28 drifts +1.9mm and heat input drops to 1.82 kJ/mm</text>
  <text x="60" y="234" font-size="12" fill="#cbd5e1">(t8/5=6.2s martensite HICC risk), a 2.4mm sidewall Lack-of-Fusion</text>
  <text x="60" y="252" font-size="12" fill="#cbd5e1">(LoF) gets buried 80mm deep under 30 subsequent passes. 48-hour</text>
  <text x="60" y="270" font-size="12" fill="#cbd5e1">post-weld NDT forces $180K &amp; 5 days of carbon-arc gouging rework!</text>

  <text x="48" y="300" font-size="13" font-weight="700" fill="#fca5a5">• 12m-Can 3-Roll Yield Scatter (+42 MPa) &amp; 0.62% Ovality:</text>
  <text x="60" y="320" font-size="12" fill="#cbd5e1">Heat-to-heat yield scatter causes elastic springback drift; ovality</text>
  <text x="60" y="338" font-size="12" fill="#cbd5e1">&gt;0.50% forces hydraulic jacking that locks residual stress in welds.</text>

