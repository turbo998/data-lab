  <text x="52" y="86" font-size="14" font-weight="600" fill="#fef08a">400-Scenario (399/400 = 99.75%), Sub-190ms Mean (189.5ms), $30.25M SLA, -92.5% TCO &amp; 224M-Vector Five-Crown Milestone! · 18 Mega-Yards · 990K EPS · 72ms Loop</text>
