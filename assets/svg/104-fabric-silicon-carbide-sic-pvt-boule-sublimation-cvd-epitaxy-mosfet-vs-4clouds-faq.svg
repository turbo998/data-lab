  <text x="376" y="68" fill="#F8FAFC" font-size="15.5" font-weight="800">8英寸碳化硅 (200mm 4H-SiC)：2,300°C PVT 升华防微管/晶型翻转、CVD 外延防三角形缺陷与 2.52 亿向量 vs 四大云</text>
