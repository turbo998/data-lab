  <rect x="40" y="138" width="420" height="510" rx="14" fill="#0E1B33" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="166" fill="#22D3EE" font-size="14" font-weight="800">01 · 2,300°C PVT 黑匣子长晶与 CVD 外延传感 (990K EPS)</text>

  <rect x="58" y="182" width="384" height="104" rx="10" fill="#132342" stroke="#06B6D4" stroke-width="1.2"/>
  <text x="74" y="204" fill="#67E8F9" font-size="12.5" font-weight="800">💎 4,800 台 200mm PVT 物理气相升华长晶炉 (2,300°C)</text>
  <text x="74" y="224" fill="#E2E8F0" font-size="11.5">• 顶部/底部双色光纤高温计 + 10kHz 中频感应线圈谐波阻抗</text>
  <text x="74" y="242" fill="#E2E8F0" font-size="11.5">• 反演捕获 #312炉 第86h 粉料石墨化致轴向温差飙至 24.8K/cm</text>
  <text x="74" y="260" fill="#34D399" font-size="11" font-weight="700">✓ 提前拦截 19.4MPa 径向剪切应力诱发的 6H 多型夹杂与微管!</text>

  <rect x="58" y="298" width="384" height="104" rx="10" fill="#132342" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="74" y="320" fill="#93C5FD" font-size="12.5" font-weight="800">⚡ 360 台 1,650°C 温壁行星式 CVD 碳化硅外延炉</text>
  <text x="74" y="340" fill="#E2E8F0" font-size="11.5">• 原位多波长激光反射率与气体质量流量计 (SiH4 / C3H8 / HCl)</text>
  <text x="74" y="358" fill="#E2E8F0" font-size="11.5">• 捕获 #18外延炉 有效表面碳硅比 (C/Si) 跌至 0.94 台阶聚并前兆</text>
  <text x="74" y="376" fill="#34D399" font-size="11" font-weight="700">✓ 阻断 3C-SiC 致命三角形缺陷，保住 $3,200/片 800V 车规外延片</text>

  <rect x="58" y="414" width="384" height="104" rx="10" fill="#132342" stroke="#10B981" stroke-width="1.2"/>
  <text x="74" y="436" fill="#6EE7B7" font-size="12.5" font-weight="800">🔬 420 台飞秒激光剥离 (Cold Split) 与全晶圆 PL/XRT</text>
  <text x="74" y="456" fill="#E2E8F0" font-size="11.5">• 全晶圆光致发光 (PL) 与 X 射线貌相 (XRT) 扫描基面位错 BPD</text>
  <text x="74" y="474" fill="#E2E8F0" font-size="11.5">• 激光改质剥离降低 45% 切片碳化硅损耗，联动 100% 绿电 PPA</text>
  <text x="74" y="492" fill="#34D399" font-size="11" font-weight="700">✓ 严防 BPD 诱发新能源汽车 800V 主驱逆变器双极性退化失效</text>

  <rect x="58" y="530" width="384" height="102" rx="10" fill="#1F122B" stroke="#F43F5E" stroke-width="1.2"/>
  <text x="74" y="552" fill="#FDA4AF" font-size="12" font-weight="800">⛔ 传统开环时间-功率曲线与云端全内存拼接栈痛点</text>
  <text x="74" y="572" fill="#FECDD3" font-size="11">• 140h 黑匣子盲烧看不见碳毡衰减与粉料烧结，6天后切片才知报废</text>
  <text x="74" y="590" fill="#FECDD3" font-size="11">• 990K EPS 云端按属性写入税高达 $138.8K/月</text>
  <text x="74" y="608" fill="#FECDD3" font-size="11">• 2.52 亿向量全内存常驻需 2.80TB+ DRAM (&gt;$50.8K/月)</text>

