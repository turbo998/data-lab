  <text x="516" y="464" fill="#E2E8F0" font-size="11.5">• 校验径向应力 8.2MPa &lt;= 12.0MPa、0 微管、BPD 265/cm² &lt;= 350/cm²</text>
  <text x="516" y="482" fill="#E2E8F0" font-size="11.5">• 校验外延致命三角形缺陷密度 0.18/cm² &lt;= 0.35/cm² 车规主驱红线</text>
