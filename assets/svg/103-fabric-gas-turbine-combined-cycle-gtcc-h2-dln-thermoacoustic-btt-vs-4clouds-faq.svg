  <rect x="20" y="18" width="1400" height="864" rx="18" fill="#091326" stroke="#1E293B" stroke-width="2"/>

  <!-- Header Banner -->
  <rect x="40" y="34" width="1360" height="88" rx="14" fill="#111F3A" stroke="#F97316" stroke-width="1.5"/>
  <rect x="58" y="50" width="298" height="26" rx="13" fill="url(#accent95)"/>
  <text x="207" y="68" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle" letter-spacing="0.8">DATA LAB · 2026-11-15 R95 · 95-ROUND &amp; 100-FAQ</text>
  <text x="372" y="68" fill="#F8FAFC" font-size="15.5" font-weight="800">H/J级掺氢重型燃机联合循环 (GTCC)：1,650°C DLN 热声防回火、50kHz 叶尖定时 BTT 防颤振与 2.48 亿向量 vs 四大云</text>
  <text x="58" y="102" fill="#94A3B8" font-size="12.5">Global H/J-Class Hydrogen-Blended GTCC (32 Plants · 128 600MW Turbines + 2,048 DLN Cans + 64 HRSG/CCUS) · 980K EPS · 248M DiskANN · 60ms Loop · -93.1% TCO ($183.2K/mo Saved)</text>
  <rect x="1186" y="47" width="196" height="60" rx="10" fill="#09152B" stroke="#10B981" stroke-width="1.5"/>
  <text x="1284" y="69" fill="#34D399" font-size="11.5" font-weight="700" text-anchor="middle">R95 路由准确率 / 本体均值</text>
  <text x="1284" y="95" fill="#F8FAFC" font-size="16.5" font-weight="800" text-anchor="middle">99.76% · 161.0ms</text>

  <!-- Left Column: Physical GTCC & H2 Combustor Telemetry Layer -->
  <rect x="40" y="138" width="420" height="510" rx="14" fill="#0E1B33" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="166" fill="#FB923C" font-size="14" font-weight="800">01 · 重型燃机掺氢燃烧与叶片传感层 (980K EPS)</text>

  <rect x="58" y="182" width="384" height="104" rx="10" fill="#132342" stroke="#F97316" stroke-width="1.2"/>
  <text x="74" y="204" fill="#FDBA74" font-size="12.5" font-weight="800">🔥 2,048 个 1,650°C 干式低氮 (DLN) 掺氢燃烧筒</text>
  <text x="74" y="224" fill="#E2E8F0" font-size="11.5">• 20kHz 高温压电动态压力传感器 (PCB) + OH* 紫外电离</text>
  <text x="74" y="242" fill="#E2E8F0" font-size="11.5">• 捕获 #09燃机 38% 掺氢下 #11筒 285Hz / 34.2kPa 热声共振</text>
  <text x="74" y="260" fill="#34D399" font-size="11" font-weight="700">✓ 喷嘴尖端 742°C 回火前兆 (H2 火焰速度 2.5m/s = 甲烷 7倍!)</text>

  <rect x="58" y="298" width="384" height="104" rx="10" fill="#132342" stroke="#0EA5E9" stroke-width="1.2"/>
  <text x="74" y="320" fill="#7DD3FC" font-size="12.5" font-weight="800">🌀 128 台 600MW 燃机 50kHz 光纤叶尖定时 (BTT)</text>
  <text x="74" y="340" fill="#E2E8F0" font-size="11.5">• 机匣周向 12 支光纤激光 BTT 探头测量纳秒级到达时间差</text>
  <text x="74" y="358" fill="#E2E8F0" font-size="11.5">• 欠采样重构捕获压气机 R1 第 19 号叶片 1.82mm @ 412Hz</text>
  <text x="74" y="376" fill="#34D399" font-size="11" font-weight="700">✓ 提前拦截非同步一阶弯曲颤振 (Flutter)，防高周疲劳断叶</text>

  <rect x="58" y="414" width="384" height="104" rx="10" fill="#132342" stroke="#10B981" stroke-width="1.2"/>
  <text x="74" y="436" fill="#6EE7B7" font-size="12.5" font-weight="800">🌿 64 套余热锅炉 (HRSG) SCR 脱硝与胺液碳捕集</text>
  <text x="74" y="456" fill="#E2E8F0" font-size="11.5">• 尾部 CEMS 连续监测 NOx (&lt;=9.0 ppm) 与 SCR 氨逃逸 (&lt;=2ppm)</text>
  <text x="74" y="474" fill="#E2E8F0" font-size="11.5">• 协调低压缸抽汽供给胺液再生釜，保持 94.5% CO2 捕集率</text>
  <text x="74" y="492" fill="#34D399" font-size="11" font-weight="700">✓ 严防盲目切扩散火焰致 NOx 暴增与硫酸氢铵糊死空预器</text>

  <rect x="58" y="530" width="384" height="102" rx="10" fill="#1F122B" stroke="#F43F5E" stroke-width="1.2"/>
  <text x="74" y="552" fill="#FDA4AF" font-size="12" font-weight="800">⛔ 传统燃机 TDM 保护盒与云端全内存拼接栈痛点</text>
  <text x="74" y="572" fill="#FECDD3" font-size="11">• 500ms 均方根 RMS 滤波看不见声火瑞利相位锁死，150ms 烧穿喷嘴</text>
  <text x="74" y="590" fill="#FECDD3" font-size="11">• 980K EPS 云端按属性写入税高达 $135.8K/月</text>
  <text x="74" y="608" fill="#FECDD3" font-size="11">• 2.48 亿向量全内存常驻需 2.75TB+ DRAM (&gt;$49.5K/月)</text>

  <!-- Center Column: Microsoft Fabric 60ms Closed Loop -->
  <rect x="480" y="138" width="480" height="510" rx="14" fill="url(#cardBlue95)" stroke="#0EA5E9" stroke-width="2"/>
  <text x="502" y="166" fill="#7DD3FC" font-size="14" font-weight="800">02 · Microsoft Fabric 60ms 热声防回火与 BTT 防颤振闭环</text>

  <rect x="500" y="182" width="440" height="102" rx="10" fill="#0B1933" stroke="#3B82F6" stroke-width="1.3"/>
  <text x="516" y="204" fill="#60A5FA" font-size="12.5" font-weight="800">Step 1 · Eventhouse KQL 15ms 互谱瑞利指数与 BTT 感知 ($0/GB)</text>
  <text x="516" y="224" fill="#E2E8F0" font-size="11.5">• 共享 F64 容量池内 $0/GB 写入税摄入 980,000 EPS 20kHz/50kHz 流</text>
  <text x="516" y="242" fill="#E2E8F0" font-size="11.5">• series_fft() 15ms 锁定 #11筒 285Hz/34.2kPa &amp; 742°C 与 R1#19 1.82mm</text>
  <text x="516" y="262" fill="#34D399" font-size="11" font-weight="700">✓ 立省 $130.9K/月写入费，比 500ms 均方根滤波器快 33 倍</text>

  <rect x="500" y="296" width="440" height="114" rx="10" fill="#0B1933" stroke="#06B6D4" stroke-width="1.3"/>
  <text x="516" y="318" fill="#22D3EE" font-size="12.5" font-weight="800">Step 2 · Fabric IQ &amp; Cosmos SSD DiskANN 15ms 2.48亿向量匹配</text>
  <text x="516" y="338" fill="#E2E8F0" font-size="11.5">• 检索 248,000,000 条三维 FTF 瑞利相图、掺氢边界层回火与坎贝尔图</text>
  <text x="516" y="356" fill="#E2E8F0" font-size="11.5">• NVMe SSD 索引省 92% 内存 ($1.5K vs $49.5K/月)，余弦相似度 0.99</text>
  <text x="516" y="374" fill="#E2E8F0" font-size="11.5">• 输出：主预混A路 -3.8% + 值班C路 +2.6% + 吹扫气 +8.5% + IGV -1.8°</text>
  <text x="516" y="394" fill="#34D399" font-size="11" font-weight="700">✓ 错开声火相位并吹扫边界层：脉动压至 2.8kPa、喷嘴 418°C 零回火</text>

  <rect x="500" y="422" width="440" height="96" rx="10" fill="#0B1933" stroke="#F59E0B" stroke-width="1.3"/>
  <text x="516" y="444" fill="#FBBF24" font-size="12.5" font-weight="800">Step 3 · Foundry IQ 规程护栏 (SOP-102 · 15ms)</text>
  <text x="516" y="464" fill="#E2E8F0" font-size="11.5">• 校验动态压力 2.8kPa &lt;= 8.0kPa、喷嘴 418°C 零回火、叶片振幅 0.24mm</text>
  <text x="516" y="482" fill="#E2E8F0" font-size="11.5">• 校验出口 NOx = 7.4 ppm &lt;= 9.0 ppm 红线，SCR 氨逃逸 1.1 ppm 零糊堵</text>
  <text x="516" y="500" fill="#34D399" font-size="11" font-weight="700">✓ 100% 阻断扩散火焰过量诱发的 NOx 超标与空预器 ABS 结垢</text>

  <rect x="500" y="530" width="440" height="102" rx="10" fill="#0B1933" stroke="#10B981" stroke-width="1.3"/>
  <text x="516" y="552" fill="#34D399" font-size="12.5" font-weight="800">Step 4 · Teams 值长确认 + ALDO 电子间边缘 &amp; 低碳电凭证 (15ms)</text>
  <text x="516" y="572" fill="#E2E8F0" font-size="11.5">• SQL on Azure Local (ALDO) 经反射内存网/EtherCAT 下发燃料阀与 IGV</text>
  <text x="516" y="590" fill="#E2E8F0" font-size="11.5">• 1GB 免费 Fabric SQL 签发 38% 绿氢 + 94.5% CCUS 凭证 (112 gCO2e/kWh)</text>
  <text x="516" y="610" fill="#34D399" font-size="11" font-weight="700">✓ 60ms 端到端闭环 · 守护 $32.35M 单晶透平热通道与调峰保电 SLA</text>

  <!-- Right Column: Multi-Cloud Coexistence & TCO -->
  <rect x="980" y="138" width="420" height="510" rx="14" fill="#0E1B33" stroke="#334155" stroke-width="1.5"/>
