  <text x="1014" y="224" fill="#E2E8F0" font-size="11.5">• Azure HPC / Databricks GPU：跑 5 亿网格三维大涡模拟 (LES)</text>
  <text x="1014" y="242" fill="#E2E8F0" font-size="11.5">  掺氢反应流与透平流固耦合 FSI，向 OneLake 写入 2.48 亿向量</text>
  <text x="1014" y="262" fill="#E2E8F0" font-size="11.5">• Snowflake / SAP S/4HANA：保留电力现货报价与燃机长协大修</text>
  <text x="1014" y="280" fill="#E2E8F0" font-size="11.5">  (LTSA EOH 寿命台账)，经 OneLake Mirroring ($0 算力) 互通</text>
  <text x="1014" y="298" fill="#34D399" font-size="11" font-weight="700">✓ 5,200 名热机工程师与交易员 DirectLake 看板 ($0 读者税)</text>

  <rect x="998" y="324" width="384" height="162" rx="10" fill="#0B1933" stroke="#10B981" stroke-width="1.4"/>
  <text x="1014" y="346" fill="#6EE7B7" font-size="12.5" font-weight="800">💰 32 座重型燃机电厂月度 TCO 对比 (980K EPS · 248M 向量)</text>
  <text x="1014" y="370" fill="#F8FAFC" font-size="11.5" font-weight="700">Microsoft Fabric (F64 + 248M SSD DiskANN + ALDO)</text>
  <rect x="1014" y="378" width="42" height="14" rx="7" fill="#10B981"/>
  <text x="1066" y="390" fill="#34D399" font-size="12" font-weight="800">$13,600 / 月 (基准最优 · 省 93.1%)</text>

  <text x="1014" y="414" fill="#CBD5E1" font-size="11.5">四云拼接栈 (按属性写入 IoT + 2.75TB 全内存向量 + BI 席位)</text>
  <rect x="1014" y="422" width="340" height="14" rx="7" fill="#EF4444"/>
  <text x="1014" y="454" fill="#FCA5A5" font-size="11.5" font-weight="700">$196,800 / 月 (归一化) | $534,600 / 月 (全量内部栈)</text>
  <text x="1014" y="474" fill="#34D399" font-size="11.5" font-weight="800">★ 净省 $183,200 / 月 ($2.20M / 年) · 95轮 &amp; 100篇双语FAQ里程碑!</text>

  <rect x="998" y="498" width="384" height="134" rx="10" fill="#132342" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="1014" y="520" fill="#7DD3FC" font-size="12.5" font-weight="800">📊 Scenario CX 实测成效与双分母披露 (R95)</text>
  <text x="1014" y="540" fill="#E2E8F0" font-size="11">• 路由评估矩阵 (n=424)：423 / 424 (99.76%) · 均值 180.5 ms</text>
  <text x="1014" y="558" fill="#E2E8F0" font-size="11">• 本体仿真均值 (n=102)：161.0 ms (本场景 CX 仅 60 ms E2E)</text>
  <text x="1014" y="576" fill="#E2E8F0" font-size="11">• 热声脉动：34.2kPa → 2.8kPa | 喷嘴温度：742°C → 418°C (0回火)</text>
  <text x="1014" y="594" fill="#E2E8F0" font-size="11">• 叶片振幅：1.82mm → 0.24mm | 排放：NOx 7.4ppm · 112gCO2e/kWh</text>
  <text x="1014" y="614" fill="#34D399" font-size="11" font-weight="700">✓ 单次规避透平打叶与停机损失：$32,350,000 ($32.35M SLA)</text>

  <!-- Bottom Summary Playbook Banner -->
  <rect x="40" y="664" width="1360" height="200" rx="14" fill="#0E1A32" stroke="#0EA5E9" stroke-width="1.5"/>
  <text x="60" y="692" fill="#7DD3FC" font-size="14" font-weight="800">04 · AI Solution Architect 掺氢重型燃机与联合循环打单金句与生产核验清单 (Checklist)</text>

  <rect x="60" y="706" width="650" height="142" rx="10" fill="#091326" stroke="#1E293B" stroke-width="1.2"/>
  <text x="78" y="728" fill="#FDBA74" font-size="12.5" font-weight="800">🎯 30 秒售前电梯演讲 (Elevator Pitch)</text>
  <text x="78" y="748" fill="#E2E8F0" font-size="11.5">“在 1,650°C 掺氢重型燃机里，氢气火焰速度是天然气的 7 倍，靠 500ms 均方根滤波器看动态</text>
  <text x="78" y="766" fill="#E2E8F0" font-size="11.5">压力，等报警响起时 $4.5M 的燃料喷嘴早已被回火烧穿！Microsoft Fabric 用 Eventhouse 在 15ms</text>
  <text x="78" y="784" fill="#E2E8F0" font-size="11.5">内算清 20kHz 声火瑞利相位与 50kHz 叶尖定时 BTT 颤振（$0/GB 写入税），再用 SSD DiskANN 在</text>
  <text x="78" y="802" fill="#E2E8F0" font-size="11.5">15ms 内匹配 2.48 亿条火焰传递函数与坎贝尔图向量，60ms 走 ALDO 电子间边缘微调燃料分流与</text>
  <text x="78" y="820" fill="#34D399" font-size="11.5" font-weight="700">可转导叶 IGV，实现零回火、零断叶且 NOx 锁在 7.4 ppm，月省 93.1% TCO！”</text>

  <rect x="730" y="706" width="650" height="142" rx="10" fill="#091326" stroke="#1E293B" stroke-width="1.2"/>
  <text x="748" y="728" fill="#6EE7B7" font-size="12.5" font-weight="800">🛠️ 生产落地五大核验项 (Production Verification Checklist)</text>
  <text x="748" y="748" fill="#E2E8F0" font-size="11.5">☑ 1. 16–24 个 DLN 燃烧筒 20kHz 动态压力 PCB 与紫外电离探针 Arrow 批量直推 Eventhouse</text>
  <text x="748" y="766" fill="#E2E8F0" font-size="11.5">☑ 2. KQL 50kHz 光纤叶尖定时 (BTT) 欠采样重构开启，实时分离同步共振与非同步气动颤振</text>
  <text x="748" y="784" fill="#E2E8F0" font-size="11.5">☑ 3. Cosmos DB SSD DiskANN 2.48 亿条 FTF/回火/坎贝尔图索引构建 (-92% 内存，P95 &lt;= 15ms)</text>
  <text x="748" y="802" fill="#E2E8F0" font-size="11.5">☑ 4. Foundry IQ SOP-102 门禁：压幅 &lt;=8.0kPa、零回火、NOx &lt;=9.0ppm、氨逃逸 &lt;=2.0ppm</text>
  <text x="748" y="820" fill="#34D399" font-size="11.5" font-weight="700">☑ 5. ALDO 电子间反射内存网下发燃料阀/IGV，1GB 免费 SQL 签发 38% 绿氢 + 112gCO2e 凭证</text>
