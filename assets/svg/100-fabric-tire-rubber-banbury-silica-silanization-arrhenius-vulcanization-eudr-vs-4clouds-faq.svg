  <text x="48" y="168" font-size="18" font-weight="800" fill="#f87171">1. Why Lagged Drop-Door TCs &amp; Fixed Cure Timers Fail Tires</text>
  <text x="48" y="196" font-size="13" font-weight="700" fill="#fca5a5">• 145–155°C Silanization Window vs. &gt;162°C Mooney Scorch:</text>
  <text x="60" y="216" font-size="12" fill="#cbd5e1">Silica-TESPT coupling needs 90–120s at 145–155°C. Drop-door wall</text>
  <text x="60" y="234" font-size="12" fill="#cbd5e1">thermocouples lag core rubber by 12–18°C; overshooting 162°C for</text>
  <text x="60" y="252" font-size="12" fill="#cbd5e1">8s cleaves disulfide bonds and scorches the 450kg batch into scrap!</text>

  <text x="48" y="284" font-size="13" font-weight="700" fill="#fca5a5">• Fixed-Time Curing vs. Thick-Shoulder Under-Cure Blowout:</text>
  <text x="60" y="304" font-size="12" fill="#cbd5e1">Rubber thermal diffusivity is 100x lower than steel. Fixed cure timers</text>
  <text x="60" y="322" font-size="12" fill="#cbd5e1">ignore bladder condensate drops (-4.8°C), leaving shoulder cores</text>
  <text x="60" y="340" font-size="12" fill="#cbd5e1">-14.2% under-cured (ECU=18.4 porosity) or surface over-cured.</text>

