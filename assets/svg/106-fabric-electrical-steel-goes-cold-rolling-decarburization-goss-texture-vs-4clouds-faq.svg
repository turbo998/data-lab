  <text x="78" y="784" fill="#E2E8F0" font-size="11.5">Fabric 用 Eventhouse 在 12ms 内按米数对齐边裂与 64 区板形（$0/GB 写入税），再用 SSD DiskANN</text>
  <text x="78" y="802" fill="#E2E8F0" font-size="11.5">在 14ms 内匹配 2.60 亿条辊系压扁与内氧化相图向量，54ms 走 ALDO 边缘微调 AS-U 鞍座、露点</text>
