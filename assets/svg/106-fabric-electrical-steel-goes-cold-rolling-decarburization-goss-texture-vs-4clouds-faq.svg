  <text x="209" y="68" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle" letter-spacing="0.8">DATA LAB · 2026-11-15 R98 · 105-ONTOLOGY &amp; 260M</text>
  <text x="376" y="68" fill="#F8FAFC" font-size="15.5" font-weight="800">0.20mm 高磁感取向硅钢 (Hi-B GOES)：二十辊森吉米尔防断带、湿氢脱碳高斯织构与 2.60 亿向量 vs 四大云</text>
  <text x="58" y="102" fill="#94A3B8" font-size="12.5">Global 0.20mm Hi-B Electrical Steel GOES (18 Works · 72 Sendzimir Mills + 48 Decarb Lines + 640 Annealing Furnaces) · 990K EPS · 260M DiskANN · 54ms Loop · -93.4% TCO ($196.7K/mo Saved)</text>
  <rect x="1186" y="47" width="196" height="60" rx="10" fill="#09152B" stroke="#10B981" stroke-width="1.5"/>
  <text x="1284" y="69" fill="#34D399" font-size="11.5" font-weight="700" text-anchor="middle">R98 矩阵均值 / 本体均值</text>
  <text x="1284" y="95" fill="#F8FAFC" font-size="16.5" font-weight="800" text-anchor="middle">176.0ms · 158.0ms</text>

  <!-- Left Column: Physical 0.20mm Hi-B GOES Telemetry Layer -->
  <rect x="40" y="138" width="420" height="510" rx="14" fill="#0E1B33" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="166" fill="#A78BFA" font-size="14" font-weight="800">01 · 二十辊轧机、脱碳与高斯织构传感层 (990K EPS)</text>

  <rect x="58" y="182" width="384" height="104" rx="10" fill="#132342" stroke="#8B5CF6" stroke-width="1.2"/>
  <text x="74" y="204" fill="#C4B5FD" font-size="12.5" font-weight="800">⚙️ 72 台二十辊森吉米尔冷轧机 (800 m/min · 3.3% Si)</text>
  <text x="74" y="224" fill="#E2E8F0" font-size="11.5">• 64 通道压磁板形辊 + 10kHz 双边线阵激光微裂纹相机</text>
  <text x="74" y="242" fill="#E2E8F0" font-size="11.5">• 捕获 #08轧机 DS侧 0.52mm 边裂叠加 41.5 I-Units 紧边张力</text>
  <text x="74" y="260" fill="#34D399" font-size="11" font-weight="700">✓ 提前拦截 B2/DO3 有序相高硅脆性断带，保住 20 根精密轧辊!</text>

  <rect x="58" y="298" width="384" height="104" rx="10" fill="#132342" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="74" y="320" fill="#93C5FD" font-size="12.5" font-weight="800">🔥 48 条 850°C 湿氢脱碳渗氮线 &amp; 640 座 1,200°C 罩式炉</text>
  <text x="74" y="340" fill="#E2E8F0" font-size="11.5">• TDLAS 激光湿氢露点仪 (P_H2O/P_H2) 与 FTIR 氨分解渗氮仪</text>
  <text x="74" y="358" fill="#E2E8F0" font-size="11.5">• 捕获 #05脱碳线 露点漂至 64.2°C 过氧化生成 FeO 露晶前兆</text>
  <text x="74" y="376" fill="#34D399" font-size="11" font-weight="700">✓ 锁死 1.48μm 铁橄榄石层，护航 {110}&lt;001&gt; 高斯二次再结晶</text>

  <rect x="58" y="414" width="384" height="104" rx="10" fill="#132342" stroke="#10B981" stroke-width="1.2"/>
  <text x="74" y="436" fill="#6EE7B7" font-size="12.5" font-weight="800">⚡ 光纤激光磁畴细化刻痕与在线 Epstein/SST 磁测</text>
  <text x="74" y="456" fill="#E2E8F0" font-size="11.5">• 在线铁损 P1.7/50 与磁感 B8 连续检测 + 光纤激光刻痕机</text>
  <text x="74" y="474" fill="#E2E8F0" font-size="11.5">• 动态加密刻痕间距至 4.2mm 细化 180° 磁畴壁，降低反常涡流损</text>
  <text x="74" y="492" fill="#34D399" font-size="11" font-weight="700">✓ 交付 B8=1.94T、P1.7/50=0.66W/kg 特高压与 AIDC 顶级硅钢</text>

  <rect x="58" y="530" width="384" height="102" rx="10" fill="#1F122B" stroke="#F43F5E" stroke-width="1.2"/>
  <text x="74" y="552" fill="#FDA4AF" font-size="12" font-weight="800">⛔ 传统单变量 AFC 板形仪与云端全内存拼接栈痛点</text>
  <text x="74" y="572" fill="#FECDD3" font-size="11">• 传统 AFC 看不见 0.5mm 边裂，2小时离线碳氧化验救不了露晶废卷</text>
  <text x="74" y="590" fill="#FECDD3" font-size="11">• 990K EPS 云端按属性写入税高达 $145.4K/月</text>
  <text x="74" y="608" fill="#FECDD3" font-size="11">• 2.60 亿向量全内存常驻需 2.90TB+ DRAM (&gt;$53.2K/月)</text>

