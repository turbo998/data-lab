  <text x="1014" y="540" fill="#E2E8F0" font-size="11">• 路由评估矩阵 (n=436)：435 / 436 (99.77%) · 均值 176.0 ms</text>
  <text x="1014" y="558" fill="#E2E8F0" font-size="11">• 本体仿真均值 (n=105)：158.0 ms (本场景 DA 仅 54 ms E2E)</text>
