  <text x="516" y="464" fill="#E2E8F0" font-size="11.5">• 校验边部张力 4.2 I-Units &lt;= 8.0 I-Units (0断带)、露点 61.8°C (1.48μm)</text>
  <text x="516" y="482" fill="#E2E8F0" font-size="11.5">• 校验铁损 P1.7/50 = 0.66 W/kg &lt;= 0.72 W/kg，磁感 B8 = 1.94 T</text>
  <text x="516" y="500" fill="#34D399" font-size="11" font-weight="700">✓ 100% 阻断高速轧机炸辊与高温退火高斯织构二次再结晶溃败</text>

  <rect x="500" y="530" width="440" height="102" rx="10" fill="#0B1933" stroke="#10B981" stroke-width="1.3"/>
  <text x="516" y="552" fill="#34D399" font-size="12.5" font-weight="800">Step 4 · Teams 总工确认 + ALDO 车间边缘 &amp; CBAM 护照 (14ms)</text>
