  <text x="516" y="590" fill="#E2E8F0" font-size="11.5">• 1GB 免费 Fabric SQL 签发 IEC 60404 与欧盟 CBAM 护照 (1.18 tCO2e/t)</text>
  <text x="516" y="610" fill="#34D399" font-size="11" font-weight="700">✓ 54ms 端到端闭环 · 守护 $33.40M 特高压与 AIDC 主变硅钢 SLA</text>

