  <rect x="1014" y="378" width="42" height="14" rx="7" fill="#10B981"/>
  <text x="1066" y="390" fill="#34D399" font-size="12" font-weight="800">$13,900 / 月 (基准最优 · 省 93.4%)</text>

  <text x="1014" y="414" fill="#CBD5E1" font-size="11.5">四云拼接栈 (按属性写入 IoT + 2.90TB 全内存向量 + BI 席位)</text>
  <rect x="1014" y="422" width="340" height="14" rx="7" fill="#EF4444"/>
