  <rect x="730" y="706" width="650" height="142" rx="10" fill="#091326" stroke="#1E293B" stroke-width="1.2"/>
  <text x="748" y="728" fill="#6EE7B7" font-size="12.5" font-weight="800">🛠️ 生产落地五大核验项 (Production Verification Checklist)</text>
  <text x="748" y="748" fill="#E2E8F0" font-size="11.5">☑ 1. 64 通道压磁板形辊与 10kHz 双边激光边裂相机按编码器米数在 Eventhouse 实时对齐</text>
  <text x="748" y="766" fill="#E2E8F0" font-size="11.5">☑ 2. 850°C 湿氢脱碳线 TDLAS 激光露点仪 (P_H2O/P_H2) 闭环锁死 62.0±0.5°C 铁橄榄石相区</text>
