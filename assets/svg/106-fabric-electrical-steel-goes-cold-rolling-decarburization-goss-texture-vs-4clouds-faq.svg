  <text x="516" y="356" fill="#E2E8F0" font-size="11.5">• NVMe SSD 索引省 92% 内存 ($1.6K vs $53.2K/月)，余弦相似度 0.99</text>
  <text x="516" y="374" fill="#E2E8F0" font-size="11.5">• 输出：AS-U #1/#2鞍座 +185μm + 一中间辊 -14mm + 蒸汽 -6.8%</text>
  <text x="516" y="394" fill="#34D399" font-size="11" font-weight="700">✓ 边部张力松弛至 4.2 I-Units 零断带，露点压回 61.8°C，刻痕 4.2mm</text>

  <rect x="500" y="422" width="440" height="96" rx="10" fill="#0B1933" stroke="#F59E0B" stroke-width="1.3"/>
