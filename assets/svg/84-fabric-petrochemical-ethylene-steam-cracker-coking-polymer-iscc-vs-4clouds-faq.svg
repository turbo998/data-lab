  <!-- Header Banner -->
  <rect x="40" y="34" width="1360" height="88" rx="14" fill="#111E38" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="58" y="50" width="276" height="26" rx="13" fill="url(#accent84)"/>
  <text x="196" y="68" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle" letter-spacing="0.8">ROUND 76 · 170-TEST &amp; 172M MILESTONE (-91.2% TCO)</text>
  <text x="350" y="68" fill="#F8FAFC" font-size="16" font-weight="800">石化千万吨乙烯蒸汽裂解、1,100°C 辐射盘管防结焦爆管、碳二加氢防飞温与 ISCC PLUS 1.72 亿向量选型</text>
  <text x="58" y="101" fill="#94A3B8" font-size="12.5">Petrochemical Steam Cracker (36 Complexes · 280 Furnaces + 72 CGCs/Converters + 140 Extruders) · Eventhouse 4ms + 172M SSD DiskANN 5ms + SDS ISCC PLUS + ALDO (19ms E2E · Save $121.3K/mo)</text>
  <rect x="1186" y="48" width="194" height="58" rx="10" fill="#0B1324" stroke="#10B981" stroke-width="1.5"/>
  <text x="1283" y="70" fill="#34D399" font-size="11.5" font-weight="700" text-anchor="middle">SCENARIO CE · DL-345..348</text>
  <text x="1283" y="94" fill="#F8FAFC" font-size="18" font-weight="800" text-anchor="middle">19ms · $25.70M SLA</text>

  <!-- Row 1 Left: 4-Step 19ms Closed-Loop Pipeline -->
  <rect x="40" y="138" width="840" height="360" rx="14" fill="url(#card84)" stroke="#1E293B" stroke-width="1.5"/>
