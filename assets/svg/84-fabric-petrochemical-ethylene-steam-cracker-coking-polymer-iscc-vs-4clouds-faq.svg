  <!-- Step 1 -->
  <rect x="60" y="182" width="800" height="68" rx="10" fill="#0F1A30" stroke="#F59E0B" stroke-width="1.2"/>
  <rect x="74" y="196" width="86" height="40" rx="8" fill="#78350F"/>
  <text x="117" y="214" fill="#FDE68A" font-size="11" font-weight="800" text-anchor="middle">STEP 1</text>
  <text x="117" y="229" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">4 ms</text>
  <text x="176" y="206" fill="#F8FAFC" font-size="13" font-weight="800">Eventhouse KQL 960K EPS 辐射炉管红外 TMT、在线拉曼 CO/乙炔与加氢床层斜率感知 ($0/GB 写入税)</text>
  <text x="176" y="226" fill="#CBD5E1" font-size="11.5">• 280 台裂解炉 + 72 套加氢/压缩机 + 140 条挤压造粒线实时入湖；免除每月 $89.2K 按属性/按 GB 工业云写入税</text>
  <text x="176" y="242" fill="#FBBF24" font-size="11.5" font-weight="700">• series_fit_line() 4ms 锁定：R-402A 加氢进料 CO 跌至 0.38ppmv (+1.42°C/s 飞温趋势) + Furnace-06 Pass-3 结焦 TMT 达 1,098°C</text>

  <!-- Step 2 -->
  <rect x="60" y="260" width="800" height="68" rx="10" fill="#0F1A30" stroke="#3B82F6" stroke-width="1.2"/>
  <rect x="74" y="274" width="86" height="40" rx="8" fill="#1E3A8A"/>
  <text x="117" y="292" fill="#93C5FD" font-size="11" font-weight="800" text-anchor="middle">STEP 2</text>
  <text x="117" y="307" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">5 ms</text>
  <text x="176" y="284" fill="#F8FAFC" font-size="13" font-weight="800">Fabric IQ 6 跳裂解孪生 × Cosmos DB 1.72 亿向量 (172M) SSD DiskANN 检索 (省 92% 内存)</text>
  <text x="176" y="304" fill="#CBD5E1" font-size="11.5">• 检索 1.72 亿条自由基裂解严苛度矩阵、Pd-Ag 加氢 CO-H2 共吸附等温线与聚烯烃 MWD 分子量分布向量 (0.99 相似，仅 $1,980/月)</text>
  <text x="176" y="320" fill="#60A5FA" font-size="11.5" font-weight="700">• 生成 R-402A 氢炔比 -14% + 1.6ppmv CO 补注、Furnace-06 稀释蒸汽比 SHC +0.06 / COT -4°C 及挤压机过氧化物 -8ppm 处方</text>

  <!-- Step 3 -->
  <rect x="60" y="338" width="800" height="68" rx="10" fill="#0F1A30" stroke="#A855F7" stroke-width="1.2"/>
  <rect x="74" y="352" width="86" height="40" rx="8" fill="#581C87"/>
  <text x="117" y="370" fill="#E9D5FF" font-size="11" font-weight="800" text-anchor="middle">STEP 3</text>
  <text x="117" y="385" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">5 ms</text>
  <text x="176" y="362" fill="#F8FAFC" font-size="13" font-weight="800">Foundry IQ 加氢防飞温、炉管防渗碳爆管与 ISCC PLUS 废塑料质量平衡护栏 (SOP-083)</text>
  <text x="176" y="382" fill="#CBD5E1" font-size="11.5">• 强制核验《PETROCHEM-CRACKER-COKING-HYDRO-ISCC-SOP-083》：确认 R-402A 床层回落至 68.4°C &lt;= 85.0°C (乙炔漏出 0.42ppmv)</text>
  <text x="176" y="398" fill="#C084FC" font-size="11.5" font-weight="700">• 确认炉管 TMT 降至 1,064°C &lt;= 1,085°C、聚乙烯 MFI 稳在 1.02 g/10min，且 18.5% 废塑料热解油 ISCC 碳足迹 0.62 tCO2e/t 零超发</text>

  <!-- Step 4 -->
  <rect x="60" y="416" width="800" height="68" rx="10" fill="#0F1A30" stroke="#10B981" stroke-width="1.2"/>
  <rect x="74" y="430" width="86" height="40" rx="8" fill="#064E3B"/>
  <text x="117" y="448" fill="#6EE7B7" font-size="11" font-weight="800" text-anchor="middle">STEP 4</text>
  <text x="117" y="463" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">5 ms</text>
  <text x="176" y="440" fill="#F8FAFC" font-size="13" font-weight="800">乙烯总工 Teams 行动卡确认 + ALDO 防爆中控室边缘 APC 下发 + 1GB 免费 SQL ISCC 落盘</text>
  <text x="176" y="460" fill="#CBD5E1" font-size="11.5">• 乙烯总工在 Teams 确认；防爆中控室 ALDO 边缘下发 OPC-UA APC 设定值，并将 ISCC PLUS 质量平衡凭证写入 1GB 免费 SQL</text>
  <text x="176" y="476" fill="#34D399" font-size="11.5" font-weight="700">• 端到端 19ms 闭环！保住 $8.6M 钯银催化剂与辐射炉管寿命，零火炬黑烟排放，守护 $25.70M SLA，月省 $121,300 (-91.2% TCO)</text>

