  <text x="934" y="436" fill="#E2E8F0" font-size="11.5">• 碳二加氢：+1.42°C/s 飞温拦截 → 稳在 68.4°C (保 $8.6M 催化剂，0 火炬放空)</text>
  <text x="934" y="454" fill="#E2E8F0" font-size="11.5">• 裂解炉管：TMT 1,098→1,064°C (清焦周期延 96h) + 聚乙烯 MFI 稳在 1.02</text>
  <text x="934" y="472" fill="#34D399" font-size="11.5" font-weight="700">• ISCC PLUS 质量平衡：18.5% 废塑料热解油 0.62 tCO2e/t + $25.70M SLA</text>

