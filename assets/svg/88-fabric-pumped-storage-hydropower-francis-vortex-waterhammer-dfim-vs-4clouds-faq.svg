  <text x="176" y="284" fill="#F8FAFC" font-size="13" font-weight="800">Fabric IQ 6 跳水力-电气孪生 × Cosmos DB 1.88 亿向量 (188M) SSD DiskANN 检索 (省 92% 内存)</text>
  <text x="176" y="304" fill="#CBD5E1" font-size="11.5">• 检索 1.88 亿条四象限全特性运转曲线 (Hill Chart)、700m 特征线法 (MOC) 水锤波与双馈磁链向量 (0.99 相似，仅 $2,100/月)</text>
  <text x="176" y="320" fill="#60A5FA" font-size="11.5" font-weight="700">• 生成双馈转子 +4.2% 变速跃迁 (412→429 rpm 跃出涡带区)、中心孔补气 140Nm³/h 与导叶两段式关闭拐点 (32% 开度延时 14.5s)</text>

  <!-- Step 3 -->
