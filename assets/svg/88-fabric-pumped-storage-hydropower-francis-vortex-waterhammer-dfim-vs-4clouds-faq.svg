  <text x="196" y="68" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle" letter-spacing="0.8">ROUND 80 · 80-ROUND &amp; 99.73% MILESTONE! (-91.6% TCO)</text>
  <text x="350" y="68" fill="#F8FAFC" font-size="16" font-weight="800">变速抽水蓄能电站 (PSH)、可逆水轮机 S 区防飞逸与涡带抑振、700m 钢管防反水锤与 24/7 CFE 1.88 亿向量选型</text>
