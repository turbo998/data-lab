  <text x="117" y="463" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">23 ms</text>
  <text x="176" y="440" fill="#F8FAFC" font-size="13" font-weight="800">抽蓄电站值长 Teams 确认 + ALDO 地下 500m 厂房边缘 IEC 61850 下发 + CFE 绿证落盘</text>
  <text x="176" y="460" fill="#CBD5E1" font-size="11.5">• 电站值长在 Teams 确认；地下 500m 主厂房 ALDO 边缘下发调速器与双馈励磁变流器指令，并归档 EnergyTag 24/7 绿储账本</text>
