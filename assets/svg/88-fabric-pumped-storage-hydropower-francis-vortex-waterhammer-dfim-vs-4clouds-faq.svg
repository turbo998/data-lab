  <rect x="60" y="182" width="800" height="68" rx="10" fill="#0F1A30" stroke="#06B6D4" stroke-width="1.2"/>
  <rect x="74" y="196" width="86" height="40" rx="8" fill="#164E63"/>
  <text x="117" y="214" fill="#67E8F9" font-size="11" font-weight="800" text-anchor="middle">STEP 1</text>
  <text x="117" y="229" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">21 ms</text>
  <text x="176" y="206" fill="#F8FAFC" font-size="13" font-weight="800">Eventhouse KQL 950K EPS 尾水管 5kHz 动态脉动、无叶区动静干涉与双馈转子流感知 ($0/GB 写入税)</text>
  <text x="176" y="226" fill="#CBD5E1" font-size="11.5">• 38 座地下变速抽蓄电站 (180 台 400MW 双馈机组 + 76 条 700m 压力钢管) 实时入湖；免除每月 $97.1K 按属性工业云写入税</text>
  <text x="176" y="242" fill="#22D3EE" font-size="11.5" font-weight="700">• series_fft() 21ms 锁定：Unit-06 尾水管 1.95Hz 螺旋涡带脉动飙至 16.8% H_r + 无叶区 105Hz 谐波逼近“S 特性”飞逸边界</text>

