  <text x="176" y="382" fill="#CBD5E1" font-size="11.5">• 强制核验《PUMPED-HYDRO-FRANCIS-VORTEX-WATERHAMMER-SOP-087》：确认尾水脉动压至 3.4% H_r &lt;= 6.0% (远离 S 区 &gt;=12.5%)</text>
  <text x="176" y="398" fill="#C084FC" font-size="11.5" font-weight="700">• 确认蜗壳峰值水锤 812 mH2O &lt;= 880 mH2O、尾水最小压力 +2.1 mH2O &gt; 0 (零液柱分离)，签发 0.0 gCO2e/kWh 24/7 CFE 证书</text>

