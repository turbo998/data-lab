  <!-- Background -->
  <rect width="1440" height="900" fill="url(#bg86)"/>
  <rect x="20" y="18" width="1400" height="864" rx="18" fill="#091224" stroke="#1E293B" stroke-width="2"/>

  <!-- Header Banner -->
  <rect x="40" y="34" width="1360" height="88" rx="14" fill="#111E38" stroke="#8B5CF6" stroke-width="1.5"/>
  <rect x="58" y="50" width="276" height="26" rx="13" fill="url(#accent86)"/>
  <text x="196" y="68" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle" letter-spacing="0.8">ROUND 78 · 85-ONTOLOGY &amp; 179.0MS MILESTONE (-91.4% TCO)</text>
  <text x="350" y="68" fill="#F8FAFC" font-size="16" font-weight="800">第四代同步辐射光源与自由电子激光 (XFEL)、亚微米束流稳轨、超导腔防失超与相干衍射 1.80 亿向量选型</text>
  <text x="58" y="101" fill="#94A3B8" font-size="12.5">4th-Gen Synchrotron &amp; XFEL (16 Facilities · 640 Beamlines + 12,000 SRF Cavities + 28,000 Magnets) · Eventhouse 2ms + 180M SSD DiskANN 3ms + FAIR Twin + ALDO (11ms E2E · Save $126.5K/mo)</text>
  <rect x="1186" y="48" width="194" height="58" rx="10" fill="#0B1324" stroke="#10B981" stroke-width="1.5"/>
  <text x="1283" y="70" fill="#34D399" font-size="11.5" font-weight="700" text-anchor="middle">SCENARIO CG · DL-353..356</text>
  <text x="1283" y="94" fill="#F8FAFC" font-size="18" font-weight="800" text-anchor="middle">11ms · $26.40M SLA</text>

  <!-- Row 1 Left: 4-Step 11ms Closed-Loop Pipeline -->
  <rect x="40" y="138" width="840" height="360" rx="14" fill="url(#card86)" stroke="#1E293B" stroke-width="1.5"/>
  <text x="60" y="166" fill="#C084FC" font-size="14" font-weight="800" letter-spacing="0.4">01 · 11ms 亚微米束流轨道反馈 (FOFB) × 超导射频腔防失超 × 相干衍射在线筛帧闭环 (Scenario CG: 2ms + 3ms + 3ms + 3ms)</text>

  <!-- Step 1 -->
  <rect x="60" y="182" width="800" height="68" rx="10" fill="#0F1A30" stroke="#8B5CF6" stroke-width="1.2"/>
  <rect x="74" y="196" width="86" height="40" rx="8" fill="#4C1D95"/>
  <text x="117" y="214" fill="#DDD6FE" font-size="11" font-weight="800" text-anchor="middle">STEP 1</text>
  <text x="117" y="229" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">2 ms</text>
  <text x="176" y="206" fill="#F8FAFC" font-size="13" font-weight="800">Eventhouse KQL 990K EPS RF-BPM 束流位置、1.3GHz 超导腔相位残差与 EIGER2 衍射流感知 ($0/GB 写入税)</text>
  <text x="176" y="226" fill="#CBD5E1" font-size="11.5">• 16 座同步辐射与 XFEL 中心 (640 条光束线 + 12,000 只超导腔 + 28,000 台磁铁电源) 实时入湖；免除每月 $93.2K 按属性工业云写入税</text>
  <text x="176" y="242" fill="#C084FC" font-size="11.5" font-weight="700">• series_fft() 2ms 锁定：ID-14 纳米探针线站 48Hz 微振引发 +2.1μm 束流漂移 + SRF-CM09 超导腔洛伦兹力失谐 +185Hz</text>

  <!-- Step 2 -->
  <rect x="60" y="260" width="800" height="68" rx="10" fill="#0F1A30" stroke="#3B82F6" stroke-width="1.2"/>
  <rect x="74" y="274" width="86" height="40" rx="8" fill="#1E3A8A"/>
  <text x="117" y="292" fill="#93C5FD" font-size="11" font-weight="800" text-anchor="middle">STEP 2</text>
  <text x="117" y="307" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">3 ms</text>
  <text x="176" y="284" fill="#F8FAFC" font-size="13" font-weight="800">Fabric IQ 6 跳机器-线站孪生 × Cosmos DB 1.80 亿向量 (180M) SSD DiskANN 检索 (省 92% 内存)</text>
  <text x="176" y="304" fill="#CBD5E1" font-size="11.5">• 检索 1.80 亿条全环 SVD 轨道响应矩阵 (ORM) 模态、压电调谐前馈张量与 Bragg-CDI / Ptychography 衍射斑向量 (0.99 相似，仅 $2,040/月)</text>
  <text x="176" y="320" fill="#60A5FA" font-size="11.5" font-weight="700">• 生成 FOFB 快校正磁铁电流、超导腔 Piezo -42V 反相补偿、纳米样品台 +1.85μm 回中，并在线剔除 84.6% 空白衍射帧</text>

  <!-- Step 3 -->
  <rect x="60" y="338" width="800" height="68" rx="10" fill="#0F1A30" stroke="#06B6D4" stroke-width="1.2"/>
  <rect x="74" y="352" width="86" height="40" rx="8" fill="#164E63"/>
  <text x="117" y="370" fill="#67E8F9" font-size="11" font-weight="800" text-anchor="middle">STEP 3</text>
  <text x="117" y="385" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">3 ms</text>
  <text x="176" y="362" fill="#F8FAFC" font-size="13" font-weight="800">Foundry IQ 亚微米稳轨、超导腔防失超与机器保护系统 (MPS) 热负荷护栏 (SOP-085)</text>
  <text x="176" y="382" fill="#CBD5E1" font-size="11.5">• 强制核验《SYNCHROTRON-XFEL-FOFB-SRF-FAIR-SOP-085》：确认电子束轨道残差压至 0.18μm &lt;= 0.25μm (&lt;10% 束流尺寸)</text>
  <text x="176" y="398" fill="#22D3EE" font-size="11.5" font-weight="700">• 确认超导腔频偏锁在 ±3.2Hz &lt;= ±10.0Hz (31.5MV/m 零失超)，2nm 芯片 Ptychography 信噪比 +4.6dB，FAIR 元数据合规</text>

  <!-- Step 4 -->
  <rect x="60" y="416" width="800" height="68" rx="10" fill="#0F1A30" stroke="#10B981" stroke-width="1.2"/>
  <rect x="74" y="430" width="86" height="40" rx="8" fill="#064E3B"/>
  <text x="117" y="448" fill="#6EE7B7" font-size="11" font-weight="800" text-anchor="middle">STEP 4</text>
  <text x="117" y="463" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">3 ms</text>
  <text x="176" y="440" fill="#F8FAFC" font-size="13" font-weight="800">运行值班长 (Shift Leader) Teams 确认 + ALDO 控制室边缘 EPICS 下发 + FAIR/NeXus 落盘</text>
  <text x="176" y="460" fill="#CBD5E1" font-size="11.5">• 运行值班长在 Teams 确认；辐射屏蔽控制室 ALDO 边缘下发 EPICS PVA 磁铁/压电指令，并归档 NeXus 开放目录</text>
  <text x="176" y="476" fill="#34D399" font-size="11.5" font-weight="700">• 端到端 11ms 闭环！本体均值首次跌破 180ms (179.0ms)，守护 $26.40M 机时与超导腔 SLA，月省 $126,500 (-91.4% TCO)</text>

  <!-- Row 1 Right: TCO & KPI Inflection Panel -->
  <rect x="898" y="138" width="502" height="360" rx="14" fill="url(#card86)" stroke="#1E293B" stroke-width="1.5"/>
  <text x="918" y="166" fill="#34D399" font-size="14" font-weight="800">02 · 16 座大科学装置月度 TCO 与双分母基准拐点</text>

  <rect x="918" y="182" width="462" height="92" rx="10" fill="#0F1A30" stroke="#10B981" stroke-width="1.2"/>
  <text x="934" y="204" fill="#94A3B8" font-size="11.5" font-weight="700">归一化月度 TCO 对比 (990K EPS + 180M Vectors + 3,400 Users)</text>
  <text x="934" y="228" fill="#34D399" font-size="13" font-weight="800">Microsoft Fabric 一体化闭环: $11,900 / 月 (省 91.4% · 1.80 亿里程碑！)</text>
  <rect x="934" y="236" width="42" height="10" rx="5" fill="#10B981"/>
  <text x="934" y="262" fill="#F87171" font-size="12" font-weight="700">传统按属性流 + 900GB 全内存向量栈: $138,400 / 月 (全栈 $367.8K)</text>

  <rect x="918" y="286" width="224" height="96" rx="10" fill="#0F1A30" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="1030" y="308" fill="#60A5FA" font-size="11.5" font-weight="700" text-anchor="middle">路由矩阵均值 (Denominator A)</text>
  <text x="1030" y="338" fill="#F8FAFC" font-size="22" font-weight="800" text-anchor="middle">210.0 ms</text>
  <text x="1030" y="360" fill="#94A3B8" font-size="11" text-anchor="middle">n = 356 (355/356 · 99.72%)</text>
  <text x="1030" y="375" fill="#34D399" font-size="10.5" font-weight="700" text-anchor="middle">较 R77 (212.0ms) 再降 2.0ms</text>

  <rect x="1156" y="286" width="224" height="96" rx="10" fill="#0F1A30" stroke="#8B5CF6" stroke-width="1.2"/>
  <text x="1268" y="308" fill="#C084FC" font-size="11.5" font-weight="700" text-anchor="middle">本体仿真均值 (Denominator B)</text>
  <text x="1268" y="338" fill="#F8FAFC" font-size="22" font-weight="800" text-anchor="middle">179.0 ms</text>
  <text x="1268" y="360" fill="#94A3B8" font-size="11" text-anchor="middle">n = 85 行业本体 (Scenario CG = 11ms)</text>
  <text x="1268" y="375" fill="#34D399" font-size="10.5" font-weight="700" text-anchor="middle">首次跌破 180ms 大关！(-2.0ms)</text>

  <rect x="918" y="394" width="462" height="90" rx="10" fill="#0F1A30" stroke="#06B6D4" stroke-width="1.2"/>
  <text x="934" y="416" fill="#22D3EE" font-size="12" font-weight="800">核心加速器物理与相干成像收益 (Accelerator &amp; Coherent X-Ray Impact)</text>
  <text x="934" y="436" fill="#E2E8F0" font-size="11.5">• 亚微米稳轨：电子束漂移 2.1→0.18μm (&lt;10% 束流尺寸，保 $6.8M 机时)</text>
  <text x="934" y="454" fill="#E2E8F0" font-size="11.5">• 超导腔与筛帧：频偏锁在 ±3.2Hz (0 失超) + 实时剔除 84.6% 空白衍射帧</text>
  <text x="934" y="472" fill="#34D399" font-size="11.5" font-weight="700">• FAIR 开放科学：OneLake IQ $0 算力共享 NeXus 本体 + $26.40M SLA</text>

  <!-- Row 2 Full Width: 5-Cloud Architecture Matrix & Coexistence -->
  <rect x="40" y="514" width="1360" height="350" rx="14" fill="url(#card86)" stroke="#1E293B" stroke-width="1.5"/>
  <text x="60" y="542" fill="#60A5FA" font-size="14" font-weight="800">03 · 五大云平台在第四代同步辐射光源、XFEL 超导腔与相干衍射场景的选型矩阵与 Better Together 共存打法</text>

  <rect x="60" y="556" width="1320" height="30" rx="6" fill="#1E293B"/>
  <text x="76" y="576" fill="#CBD5E1" font-size="11.5" font-weight="700">核心技术能力维度</text>
  <text x="430" y="576" fill="#38BDF8" font-size="11.5" font-weight="800" text-anchor="middle">Microsoft Fabric (首选闭环)</text>
  <text x="690" y="576" fill="#F97316" font-size="11.5" font-weight="700" text-anchor="middle">Databricks (PyNX 相位恢复互补)</text>
  <text x="930" y="576" fill="#60A5FA" font-size="11.5" font-weight="700" text-anchor="middle">Snowflake (课题机时结算互补)</text>
  <text x="1140" y="576" fill="#FBBF24" font-size="11.5" font-weight="700" text-anchor="middle">AWS SiteWise / OpenSearch</text>
  <text x="1310" y="576" fill="#34D399" font-size="11.5" font-weight="700" text-anchor="middle">GCP BigQuery / Vertex</text>

  <text x="76" y="606" fill="#F8FAFC" font-size="11.5">1. 990K EPS RF-BPM 与 LLRF 流</text>
  <text x="430" y="606" fill="#34D399" font-size="11.5" font-weight="800" text-anchor="middle">★ 2ms KQL ($0/GB 写入税)</text>
  <text x="690" y="606" fill="#E2E8F0" font-size="11.5" text-anchor="middle">350ms–2s (常驻 DBU 昂贵)</text>
  <text x="930" y="606" fill="#94A3B8" font-size="11.5" text-anchor="middle">&gt;= 60s (Dynamic Tables 滞后)</text>
  <text x="1140" y="606" fill="#E2E8F0" font-size="11.5" text-anchor="middle">250ms–2s ($93.2K/mo 属性税)</text>
  <text x="1310" y="606" fill="#E2E8F0" font-size="11.5" text-anchor="middle">180ms–1.5s (按 MB 计费)</text>

  <text x="76" y="636" fill="#F8FAFC" font-size="11.5">2. 1.80 亿 (180M) 响应矩阵/衍射向量</text>
  <text x="430" y="636" fill="#34D399" font-size="11.5" font-weight="800" text-anchor="middle">★ 3ms SSD DiskANN ($2.04K/mo)</text>
  <text x="690" y="636" fill="#E2E8F0" font-size="11.5" text-anchor="middle">22ms (Mosaic Vector 全内存)</text>
  <text x="930" y="636" fill="#94A3B8" font-size="11.5" text-anchor="middle">35ms+ (Cortex 偏文档检索)</text>
  <text x="1140" y="636" fill="#F87171" font-size="11.5" text-anchor="middle">24ms (900GB DRAM $34.4K/mo)</text>
  <text x="1310" y="636" fill="#E2E8F0" font-size="11.5" text-anchor="middle">21ms (Vertex 内存节点昂贵)</text>

  <text x="76" y="666" fill="#F8FAFC" font-size="11.5">3. 屏蔽控制室边缘与 FAIR 开放共享</text>
  <text x="430" y="666" fill="#34D399" font-size="11.5" font-weight="800" text-anchor="middle">★ ALDO 3ms 边缘 + IQ $0 共享</text>
  <text x="690" y="666" fill="#E2E8F0" font-size="11.5" text-anchor="middle">强于 3D Ptychography / Cryo-EM 重建</text>
  <text x="930" y="666" fill="#E2E8F0" font-size="11.5" text-anchor="middle">强于跨国课题 Proposal 与经费管理</text>
  <text x="1140" y="666" fill="#94A3B8" font-size="11.5" text-anchor="middle">需自建 Greengrass + S3 复制</text>
  <text x="1310" y="666" fill="#94A3B8" font-size="11.5" text-anchor="middle">无隧道屏蔽控制室 SQL 控制面</text>

  <text x="76" y="696" fill="#F8FAFC" font-size="11.5">4. 3,400 名学者并发与月度 TCO</text>
  <text x="430" y="696" fill="#34D399" font-size="11.5" font-weight="800" text-anchor="middle">★ $11,900/月 ($0 席位 · 省 91.4%)</text>
  <text x="690" y="696" fill="#E2E8F0" font-size="11.5" text-anchor="middle">$135,100 / 月</text>
  <text x="930" y="696" fill="#E2E8F0" font-size="11.5" text-anchor="middle">$140,200 / 月</text>
  <text x="1140" y="696" fill="#F87171" font-size="11.5" text-anchor="middle">$138,400 / 月</text>
  <text x="1310" y="696" fill="#E2E8F0" font-size="11.5" text-anchor="middle">$132,500 / 月</text>

  <!-- Coexistence Playbook Boxes -->
  <rect x="60" y="720" width="648" height="126" rx="10" fill="#0F1A30" stroke="#F97316" stroke-width="1.2"/>
  <text x="78" y="744" fill="#FB923C" font-size="12.5" font-weight="800">模式 B 共存 · Fabric × Azure HPC / Databricks GPU (3D 相干叠层成像与冷冻电镜重建)</text>
  <text x="78" y="766" fill="#E2E8F0" font-size="11.5">• PyNX / ePIE 三维叠层相干衍射迭代相位恢复与单颗粒冷冻电镜重建保留在 Databricks GPU</text>
  <text x="78" y="786" fill="#E2E8F0" font-size="11.5">• 产出的 1.80 亿条 SVD 轨道响应模态、LLRF 前馈与衍射斑指纹通过 OneLake Shortcuts 直通 SSD DiskANN</text>
  <text x="78" y="806" fill="#34D399" font-size="11.5" font-weight="700">• 价值：免除 900GB 常驻内存向量税，3ms 过滤 84.6% 空白衍射帧并实时校正纳米探针轨道</text>

  <rect x="732" y="720" width="648" height="126" rx="10" fill="#0F1A30" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="750" y="744" fill="#38BDF8" font-size="12.5" font-weight="800">模式 A 共存 · Fabric × Snowflake / Globus &amp; SAP (全球访问学者机时管理与 FAIR 共享)</text>
  <text x="750" y="766" fill="#E2E8F0" font-size="11.5">• 全球高校机时申请 (Proposal Portal)、DataCite DOI 元数据与科研基金结算保留在 Snowflake / SAP</text>
  <text x="750" y="786" fill="#E2E8F0" font-size="11.5">• 通过 OneLake Zero-ETL Mirroring ($0 算力) 与 OneLake IQ Sharing (.rdf 束流本体) 零拷贝开放</text>
  <text x="750" y="806" fill="#34D399" font-size="11.5" font-weight="700">• 价值：11ms 机器-线站协同闭环，3,400 名访问学者与科学家享 DirectLake $0 读者席位</text>
