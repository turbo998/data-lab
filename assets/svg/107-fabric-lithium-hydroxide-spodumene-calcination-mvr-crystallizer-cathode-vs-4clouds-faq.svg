  <text x="748" y="784" fill="#E2E8F0" font-size="11.5">☑ 3. Cosmos DB SSD DiskANN 2.64 亿条四元相图/PBM/除铁索引构建 (-92% 内存，P95 &lt;= 13ms)</text>
