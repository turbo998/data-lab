  <text x="516" y="356" fill="#E2E8F0" font-size="11.5">• NVMe SSD 索引省 92% 内存 ($1.6K vs $54.5K/月)，余弦相似度 0.99</text>
  <text x="516" y="374" fill="#E2E8F0" font-size="11.5">• 输出：烧嘴燃气 -4.2% + 旋流风 +3.5° + 细晶消除外循环 +24%</text>
  <text x="516" y="394" fill="#34D399" font-size="11" font-weight="700">✓ 料温压回 1,064.0°C (β转晶率 98.8% 零结圈)，D50=448μm</text>

  <rect x="500" y="422" width="440" height="96" rx="10" fill="#0B1933" stroke="#F59E0B" stroke-width="1.3"/>
