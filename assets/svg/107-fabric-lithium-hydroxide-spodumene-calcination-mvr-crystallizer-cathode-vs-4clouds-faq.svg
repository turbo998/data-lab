  <text x="1014" y="474" fill="#34D399" font-size="11.5" font-weight="800">★ 净省 $201,400 / 月 ($2.42M / 年) · 突破月省 $200K 大关!</text>

  <rect x="998" y="498" width="384" height="134" rx="10" fill="#132342" stroke="#38BDF8" stroke-width="1.2"/>
