  <text x="78" y="748" fill="#E2E8F0" font-size="11.5">“在 1,050°C 锂辉石转晶窑与 MVR 结晶器里，窗口窄到只有 ±15°C，靠 4 小时离线 XRD 与粒度仪</text>
