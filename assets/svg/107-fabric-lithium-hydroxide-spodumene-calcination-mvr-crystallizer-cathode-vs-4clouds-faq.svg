  <text x="78" y="820" fill="#34D399" font-size="11.5" font-weight="700">与消晶外循环，锁死 98.8% 转晶率、D50=448μm 与 26ppb 磁性异物，月省 $201.4K (93.5%)！”</text>

  <rect x="730" y="706" width="650" height="142" rx="10" fill="#091326" stroke="#1E293B" stroke-width="1.2"/>
