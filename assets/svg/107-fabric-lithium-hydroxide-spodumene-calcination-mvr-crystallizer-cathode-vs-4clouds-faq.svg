  <text x="209" y="68" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle" letter-spacing="0.8">DATA LAB · 2026-11-15 R99 · 440-SCENARIO &amp; &gt;$200K/MO</text>
  <text x="376" y="68" fill="#F8FAFC" font-size="15.5" font-weight="800">硬岩锂辉石 1,050°C 转晶与电池级氢氧化锂 (LiOH·H2O)：回转窑防结圈、MVR 结晶防细晶与 2.64 亿向量 vs 四大云</text>
  <text x="58" y="102" fill="#94A3B8" font-size="12.5">Global Spodumene Calcination &amp; Battery-Grade LiOH·H2O (24 Refineries · 72 1,050°C Kilns + 144 MVR DTB Crystallizers + 280 Magnetic Trains) · 980K EPS · 264M DiskANN · 52ms Loop · -93.5% TCO ($201.4K/mo Saved!)</text>
  <rect x="1186" y="47" width="196" height="60" rx="10" fill="#09152B" stroke="#10B981" stroke-width="1.5"/>
  <text x="1284" y="69" fill="#34D399" font-size="11.5" font-weight="700" text-anchor="middle">R99 矩阵均值 / 本体均值</text>
  <text x="1284" y="95" fill="#F8FAFC" font-size="16.5" font-weight="800" text-anchor="middle">174.5ms · 157.0ms</text>

  <!-- Left Column: Physical Spodumene & LiOH Telemetry Layer -->
  <rect x="40" y="138" width="420" height="510" rx="14" fill="#0E1B33" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="166" fill="#34D399" font-size="14" font-weight="800">01 · 1,050°C 转晶窑与 MVR 结晶传感层 (980K EPS)</text>

  <rect x="58" y="182" width="384" height="104" rx="10" fill="#132342" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="74" y="204" fill="#FDE68A" font-size="12.5" font-weight="800">🔥 72 座 1,050°C 锂辉石 α→β 爆裂转晶回转窑</text>
  <text x="74" y="224" fill="#E2E8F0" font-size="11.5">• 胴体红外热像扫描 + 主电机扭矩电流谐波 + 在线 XRF 脉石</text>
  <text x="74" y="242" fill="#E2E8F0" font-size="11.5">• 捕获 #14转晶窑 22-28m 烧成带料温升至 1,091.4°C 偏心脉动</text>
  <text x="74" y="260" fill="#34D399" font-size="11" font-weight="700">✓ 提前拦截长石脉石低共熔粘壁结成 400 吨玻璃态结圈!</text>

  <rect x="58" y="298" width="384" height="104" rx="10" fill="#132342" stroke="#0EA5E9" stroke-width="1.2"/>
  <text x="74" y="320" fill="#7DD3FC" font-size="12.5" font-weight="800">❄️ 144 台 MVR 导流筒挡板 (DTB) 连续真空结晶器</text>
  <text x="74" y="340" fill="#E2E8F0" font-size="11.5">• 原位聚焦光束反射仪 (FBRM) 弦长分布 + ATR-FTIR 过饱和度</text>
  <text x="74" y="358" fill="#E2E8F0" font-size="11.5">• 捕获 #09结晶器 &lt;40μm 细晶弦长计数率以 +340%/min 暴增</text>
  <text x="74" y="376" fill="#34D399" font-size="11" font-weight="700">✓ 提前阻断越过介稳区 (MSZW) 的二次成核“细晶雪崩”</text>

  <rect x="58" y="414" width="384" height="104" rx="10" fill="#132342" stroke="#10B981" stroke-width="1.2"/>
  <text x="74" y="436" fill="#6EE7B7" font-size="12.5" font-weight="800">🧲 280 条 20,000 高斯高梯度电磁除铁与氮封包装线</text>
  <text x="74" y="456" fill="#E2E8F0" font-size="11.5">• 在线 ICP-MS 与超高灵敏度磁感探头监测 Fe/Cr/Ni/Zn 异物</text>
  <text x="74" y="474" fill="#E2E8F0" font-size="11.5">• 超纯氮气正压保护阻断空气 CO2 碳化生成碳酸锂混晶</text>
  <text x="74" y="492" fill="#34D399" font-size="11" font-weight="700">✓ 锁死磁性异物 26 ppb &lt;= 50 ppb，严防刺穿动力电池隔膜</text>

  <rect x="58" y="530" width="384" height="102" rx="10" fill="#1F122B" stroke="#F43F5E" stroke-width="1.2"/>
  <text x="74" y="552" fill="#FDA4AF" font-size="12" font-weight="800">⛔ 传统 4 小时离线 XRD/激光粒度与云端全内存拼接栈痛点</text>
  <text x="74" y="572" fill="#FECDD3" font-size="11">• 4h 离线化验看不见精矿脉石波动与细晶爆发，18h 粒度震荡降级</text>
  <text x="74" y="590" fill="#FECDD3" font-size="11">• 980K EPS 云端按属性写入税高达 $149.2K/月</text>
  <text x="74" y="608" fill="#FECDD3" font-size="11">• 2.64 亿向量全内存常驻需 2.95TB+ DRAM (&gt;$54.5K/月)</text>

