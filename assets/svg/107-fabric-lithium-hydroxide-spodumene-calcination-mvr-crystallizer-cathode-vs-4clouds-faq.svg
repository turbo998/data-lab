  <text x="516" y="464" fill="#E2E8F0" font-size="11.5">• 校验 β 转晶率 98.8% &gt;= 97.5%、0 结圈、晶体 D50=448μm 达标</text>
  <text x="516" y="482" fill="#E2E8F0" font-size="11.5">• 校验磁性异物 26 ppb &lt;= 50 ppb 红线，CO3²- &lt; 0.21% 零碳化混晶</text>
  <text x="516" y="500" fill="#34D399" font-size="11" font-weight="700">✓ 100% 阻断回转窑结圈停窑与高镍三元正极材料磁性异物击穿</text>

  <rect x="500" y="530" width="440" height="102" rx="10" fill="#0B1933" stroke="#10B981" stroke-width="1.3"/>
  <text x="516" y="552" fill="#34D399" font-size="12.5" font-weight="800">Step 4 · Teams 总工确认 + ALDO 车间边缘 &amp; 电池护照 (13ms)</text>
  <text x="516" y="572" fill="#E2E8F0" font-size="11.5">• SQL on Azure Local (ALDO) 13ms 驱动烧嘴旋流风、消晶泵与除铁阀</text>
  <text x="516" y="590" fill="#E2E8F0" font-size="11.5">• 1GB 免费 Fabric SQL 签发欧盟电池护照低碳证书 (4.85 kgCO2e/kg)</text>
  <text x="516" y="610" fill="#34D399" font-size="11" font-weight="700">✓ 52ms 端到端闭环 · 守护 $33.75M 电池级氢氧化锂长协交付 SLA</text>

