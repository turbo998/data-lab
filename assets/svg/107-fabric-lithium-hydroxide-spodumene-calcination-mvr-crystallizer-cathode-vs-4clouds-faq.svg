  <rect x="500" y="182" width="440" height="102" rx="10" fill="#0B1933" stroke="#3B82F6" stroke-width="1.3"/>
  <text x="516" y="204" fill="#60A5FA" font-size="12.5" font-weight="800">Step 1 · Eventhouse KQL 13ms 结圈扭矩与 FBRM 细晶感知 ($0/GB)</text>
  <text x="516" y="224" fill="#E2E8F0" font-size="11.5">• 共享 F64 容量池内 $0/GB 写入税摄入 980,000 EPS 红外/弦长流</text>
  <text x="516" y="242" fill="#E2E8F0" font-size="11.5">• 13ms 锁定 #14窑 1,091.4°C 粘壁前兆与 #09结晶器 +340%/min 细晶</text>
  <text x="516" y="262" fill="#34D399" font-size="11" font-weight="700">✓ 立省 $144.3K/月写入费，终结 4 小时离线 XRD 与粒度仪盲区</text>

  <rect x="500" y="296" width="440" height="114" rx="10" fill="#0B1933" stroke="#06B6D4" stroke-width="1.3"/>
