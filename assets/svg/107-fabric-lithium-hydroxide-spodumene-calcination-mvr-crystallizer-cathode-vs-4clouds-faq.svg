  <text x="1014" y="540" fill="#E2E8F0" font-size="11">• 路由评估矩阵 (n=440)：439 / 440 (99.77%) · 均值 174.5 ms (&lt;175ms!)</text>
  <text x="1014" y="558" fill="#E2E8F0" font-size="11">• 本体仿真均值 (n=106)：157.0 ms (本场景 DB 仅 52 ms E2E)</text>
  <text x="1014" y="576" fill="#E2E8F0" font-size="11">• 转晶与结晶：1,064.0°C (β转晶率98.8% 0结圈) | D50=448μm</text>
  <text x="1014" y="594" fill="#E2E8F0" font-size="11">• 电池级纯度：磁性异物 26 ppb &lt;= 50 ppb · 4.85 kgCO2e/kg</text>
