  <rect x="40" y="138" width="420" height="510" rx="14" fill="#0E1B33" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="166" fill="#FBBF24" font-size="14" font-weight="800">01 · 3,000 bar 超高压反应器与压缩机传感层 (980K EPS)</text>

  <rect x="58" y="182" width="384" height="104" rx="10" fill="#132342" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="74" y="204" fill="#FDE68A" font-size="12.5" font-weight="800">💥 64 套 3,000 bar (300 MPa) 超高压管式/釜式反应器</text>
  <text x="74" y="224" fill="#E2E8F0" font-size="11.5">• 沿 2.5km 管线 320 支 1kHz 快响应热电偶与压力变送器</text>
  <text x="74" y="242" fill="#E2E8F0" font-size="11.5">• 解卷积捕获 #07反应器 第3峰区 +18.4°C/s 指数抬头 (318.6°C)</text>
  <text x="74" y="260" fill="#34D399" font-size="11" font-weight="700">✓ 比 335°C 静态阈值提前 850ms 拦截 1,200°C 乙烯分解放黑炮!</text>

  <rect x="58" y="298" width="384" height="104" rx="10" fill="#132342" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="74" y="320" fill="#93C5FD" font-size="12.5" font-weight="800">⚙️ 128 台 30MW 二次超高压往复压缩机 (碳化钨柱塞)</text>
  <text x="74" y="340" fill="#E2E8F0" font-size="11.5">• 青铜-PTFE 填料函 50kHz 声发射 (AE) 与柱塞微位移涡流探头</text>
  <text x="74" y="358" fill="#E2E8F0" font-size="11.5">• 捕获 #04压缩机 B2 缸碳化钨柱塞油膜干摩擦声发射 +14.2 dB</text>
  <text x="74" y="376" fill="#34D399" font-size="11" font-weight="700">✓ 毫秒级增注高压白油，保住 $850K 脆性实心碳化钨柱塞零碎裂</text>

  <rect x="58" y="414" width="384" height="104" rx="10" fill="#132342" stroke="#10B981" stroke-width="1.2"/>
  <text x="74" y="436" fill="#6EE7B7" font-size="12.5" font-weight="800">⚡ 180 条百级洁净室 ±525 kV 海缆超净 XLPE 造粒线</text>
  <text x="74" y="456" fill="#E2E8F0" font-size="11.5">• 20MHz 线阵 CCD 激光透射扫描切粒熔体中的微米级焦烧晶点</text>
  <text x="74" y="474" fill="#E2E8F0" font-size="11.5">• 拦截 32–45μm 微黄点萌芽，确保 &gt;50μm 琥珀色焦烧 = 0.0 颗/kg</text>
  <text x="74" y="492" fill="#34D399" font-size="11" font-weight="700">✓ 满足 CIGRE TB 852 直流体积电阻率 &gt;10^16 Ω·cm 严苛标准</text>

  <rect x="58" y="530" width="384" height="102" rx="10" fill="#1F122B" stroke="#F43F5E" stroke-width="1.2"/>
  <text x="74" y="552" fill="#FDA4AF" font-size="12" font-weight="800">⛔ 传统 335°C 静态 ESD 阈值与云端全内存拼接栈痛点</text>
  <text x="74" y="572" fill="#FECDD3" font-size="11">• 高压护套滞后 200ms+，等读数到 335°C 时核心已超 550°C 炸裂爆破片</text>
  <text x="74" y="590" fill="#FECDD3" font-size="11">• 980K EPS 云端按属性写入税高达 $142.0K/月</text>
  <text x="74" y="608" fill="#FECDD3" font-size="11">• 2.56 亿向量全内存常驻需 2.85TB+ DRAM (&gt;$52.0K/月)</text>

