  <text x="516" y="464" fill="#E2E8F0" font-size="11.5">• 校验峰温 298.4°C &lt;= 312.0°C、0 爆破片起跳、柱塞声发射回落 -14.2dB</text>
  <text x="516" y="482" fill="#E2E8F0" font-size="11.5">• 校验 &gt;50μm 琥珀色焦烧晶点 = 0.0 颗/kg，体积电阻率 &gt;10^16 Ω·cm</text>
  <text x="516" y="500" fill="#34D399" font-size="11" font-weight="700">✓ 100% 阻断反应器分解爆炸与 525kV 海底电缆电树枝击穿风险</text>

  <rect x="500" y="530" width="440" height="102" rx="10" fill="#0B1933" stroke="#10B981" stroke-width="1.3"/>
