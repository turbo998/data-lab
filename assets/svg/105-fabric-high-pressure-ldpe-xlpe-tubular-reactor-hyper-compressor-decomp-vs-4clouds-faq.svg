  <text x="376" y="68" fill="#F8FAFC" font-size="15.5" font-weight="800">3,000 bar 超高压 LDPE &amp; 525kV 海缆超净 XLPE：乙烯分解防爆 (Decomp)、30MW 压缩机护柱塞与 2.56 亿向量 vs 四大云</text>
