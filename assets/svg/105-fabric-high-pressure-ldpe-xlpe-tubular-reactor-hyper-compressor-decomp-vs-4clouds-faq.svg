  <text x="78" y="820" fill="#34D399" font-size="11.5" font-weight="700">实现零分解、零碳化钨柱塞碎裂与 525kV 海缆料零焦烧晶点，月省 93.3% TCO！”</text>

  <rect x="730" y="706" width="650" height="142" rx="10" fill="#091326" stroke="#1E293B" stroke-width="1.2"/>
