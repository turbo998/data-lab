  <text x="934" y="436" fill="#E2E8F0" font-size="11.5">• 千米钾矿：留设 32.0m 完整防水盐层 (0 卤水突水，守护百亿矿井资产)</text>
  <text x="934" y="454" fill="#E2E8F0" font-size="11.5">• 磷酸与造粒：游离酸稳在 2.42% (92μm 粗晶零糊布) + 成球率提至 89.4%</text>
  <text x="934" y="472" fill="#34D399" font-size="11.5" font-weight="700">• 欧盟 EU FPR 2019/1009：14.2 mg/kg 低镉绿标护照 + $26.75M SLA</text>

