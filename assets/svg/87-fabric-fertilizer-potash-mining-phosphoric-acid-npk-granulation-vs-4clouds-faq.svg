  <text x="196" y="68" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle" letter-spacing="0.8">ROUND 79 · 360-SCENARIO &amp; 7MS MILESTONE (-91.5% TCO)</text>
  <text x="350" y="68" fill="#F8FAFC" font-size="16" font-weight="800">千米深井钾盐矿 (Potash) 防透水微震、湿法磷酸 (WPA) 防结垢糊布、NPK 造粒与欧盟低镉 1.84 亿向量选型</text>
  <text x="58" y="101" fill="#94A3B8" font-size="12.5">Deep-Shaft Potash &amp; Phosphate (24 Complexes · 140 1,100m Borers + 64 WPA Reactors + 120 NPK Drums) · Eventhouse 1ms + 184M SSD DiskANN 2ms + SDS EU FPR + ALDO (7ms E2E · Save $129.2K/mo)</text>
  <rect x="1186" y="48" width="194" height="58" rx="10" fill="#0B1324" stroke="#10B981" stroke-width="1.5"/>
  <text x="1283" y="70" fill="#34D399" font-size="11.5" font-weight="700" text-anchor="middle">SCENARIO CH · DL-357..360</text>
  <text x="1283" y="94" fill="#F8FAFC" font-size="18" font-weight="800" text-anchor="middle">7ms · $26.75M SLA</text>

  <!-- Row 1 Left: 4-Step 7ms Closed-Loop Pipeline -->
