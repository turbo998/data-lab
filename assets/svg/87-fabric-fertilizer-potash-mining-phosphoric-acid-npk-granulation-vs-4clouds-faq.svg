  <text x="60" y="166" fill="#34D399" font-size="14" font-weight="800" letter-spacing="0.4">01 · 7ms 地下 1,100m 钾矿防透水 × 湿法磷酸防细针晶糊布 × 欧盟低镉闭环 (Scenario CH: 1ms + 2ms + 2ms + 2ms)</text>

  <!-- Step 1 -->
  <rect x="60" y="182" width="800" height="68" rx="10" fill="#0F1A30" stroke="#10B981" stroke-width="1.2"/>
  <rect x="74" y="196" width="86" height="40" rx="8" fill="#064E3B"/>
  <text x="117" y="214" fill="#6EE7B7" font-size="11" font-weight="800" text-anchor="middle">STEP 1</text>
  <text x="117" y="229" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">1 ms</text>
  <text x="176" y="206" fill="#F8FAFC" font-size="13" font-weight="800">Eventhouse KQL 910K EPS 地下 1,100m 微震/瞬变电磁、在线拉曼游离酸与粒径流感知 ($0/GB 写入税)</text>
  <text x="176" y="226" fill="#CBD5E1" font-size="11.5">• 24 座钾矿与磷复肥基地 (140 台深井采矿机 + 64 套磷酸槽 + 120 条造粒线) 实时入湖；免除每月 $95.2K 按属性工业云写入税</text>
  <text x="176" y="242" fill="#34D399" font-size="11.5" font-weight="700">• series_fft() 1ms 锁定：Panel-14 顶板 180Hz 微震 (防水盐层缩至 26.2m) + WPA-03 反应槽游离硫酸根冲高至 3.42% (细针晶风险)</text>

  <!-- Step 2 -->
  <rect x="60" y="260" width="800" height="68" rx="10" fill="#0F1A30" stroke="#3B82F6" stroke-width="1.2"/>
  <rect x="74" y="274" width="86" height="40" rx="8" fill="#1E3A8A"/>
  <text x="117" y="292" fill="#93C5FD" font-size="11" font-weight="800" text-anchor="middle">STEP 2</text>
  <text x="117" y="307" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">2 ms</text>
  <text x="176" y="284" fill="#F8FAFC" font-size="13" font-weight="800">Fabric IQ 6 跳矿化孪生 × Cosmos DB 1.84 亿向量 (184M) SSD DiskANN 检索 (省 92% 内存)</text>
  <text x="176" y="304" fill="#CBD5E1" font-size="11.5">• 检索 1.84 亿条盐岩微震矩张量、CaSO4-H3PO4-H2SO4 过饱和结晶相图与 NPK 转鼓种群平衡向量 (0.99 相似，仅 $2,070/月)</text>
  <text x="176" y="320" fill="#60A5FA" font-size="11.5" font-weight="700">• 生成采矿机抬刀留设 32.0m 防水盐层、WPA-03 硫酸给料 -6.8% + 淡酸回流 +4.2% 及造粒蒸汽 -12% 处方</text>

  <!-- Step 3 -->
  <rect x="60" y="338" width="800" height="68" rx="10" fill="#0F1A30" stroke="#A855F7" stroke-width="1.2"/>
  <rect x="74" y="352" width="86" height="40" rx="8" fill="#581C87"/>
  <text x="117" y="370" fill="#E9D5FF" font-size="11" font-weight="800" text-anchor="middle">STEP 3</text>
  <text x="117" y="385" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">2 ms</text>
  <text x="176" y="362" fill="#F8FAFC" font-size="13" font-weight="800">Foundry IQ 防水盐岩顶板、石膏粗晶防糊布与欧盟 EU FPR 2019/1009 低镉护栏 (SOP-086)</text>
  <text x="176" y="382" fill="#CBD5E1" font-size="11.5">• 强制核验《FERTILIZER-POTASH-WPA-NPK-EUFPR-SOP-086》：确认防水盐岩厚度恢复至 32.0m &gt;= 28.0m (0.0 L/min 卤水渗漏)</text>
  <text x="176" y="398" fill="#C084FC" font-size="11.5" font-weight="700">• 确认游离硫酸根回落至 2.42% (石膏 D50=92μm 零糊布)，NPK 成球率升至 89.4%，重金属镉 14.2 mg/kg P2O5 &lt;= 20mg/kg 绿标</text>

  <!-- Step 4 -->
  <rect x="60" y="416" width="800" height="68" rx="10" fill="#0F1A30" stroke="#F59E0B" stroke-width="1.2"/>
  <rect x="74" y="430" width="86" height="40" rx="8" fill="#78350F"/>
  <text x="117" y="448" fill="#FDE68A" font-size="11" font-weight="800" text-anchor="middle">STEP 4</text>
  <text x="117" y="463" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">2 ms</text>
  <text x="176" y="440" fill="#F8FAFC" font-size="13" font-weight="800">矿化总工 Teams 行动卡确认 + ALDO 地下 1,100m 硐室边缘 PLC 下发 + EU FPR 护照落盘</text>
  <text x="176" y="460" fill="#CBD5E1" font-size="11.5">• 矿业与化工总工在 Teams 确认；井下与车间 ALDO 边缘下发 OPC-UA PLC 设定值，并归档欧盟 EU FPR 低镉护照</text>
