  <text x="213" y="68" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle" letter-spacing="0.8">🏆 DATA LAB · R100 CENTENNIAL &amp; 105-FAQ!</text>
  <text x="384" y="68" fill="#F8FAFC" font-size="15.5" font-weight="800">13.5nm 极紫外 (EUV) 50kHz 锡液滴光源、Mo/Si 收集镜氢除锡、45nm CNT 防尘膜与 2.68 亿向量 vs 四大云</text>
  <text x="58" y="102" fill="#94A3B8" font-size="12.5">Centennial Round 100! Global 13.5nm EUV LPP Source, Collector &amp; CNT Pellicle (16 Fabs · 540 50kHz Vessels + 1,080 Collectors + 2,400 Bays) · 990K EPS · 268M DiskANN · 50ms Loop · -93.6% TCO ($206.3K/mo Saved)</text>
  <rect x="1186" y="47" width="196" height="60" rx="10" fill="#09152B" stroke="#F59E0B" stroke-width="1.8"/>
  <text x="1284" y="69" fill="#FBBF24" font-size="11.5" font-weight="800" text-anchor="middle">🏆 R100 矩阵均值 / 本体均值</text>
  <text x="1284" y="95" fill="#F8FAFC" font-size="16.5" font-weight="800" text-anchor="middle">173.0ms · 156.0ms</text>

  <!-- Left Column: Physical 13.5nm EUV LPP Source & CNT Pellicle Telemetry Layer -->
  <rect x="40" y="138" width="420" height="510" rx="14" fill="#0E1B33" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="166" fill="#FBBF24" font-size="14" font-weight="800">01 · 50kHz 锡液滴双脉冲与 CNT 防尘膜传感 (990K EPS)</text>

  <rect x="58" y="182" width="384" height="104" rx="10" fill="#132342" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="74" y="204" fill="#FDE68A" font-size="12.5" font-weight="800">⚡ 540 套 50,000 Hz 熔融锡 (Sn) 液滴双脉冲 LPP 光源</text>
  <text x="74" y="224" fill="#E2E8F0" font-size="11.5">• 27μm 锡滴 80m/s 双正交激光阴影相机 + 30kW CO2 激光波前</text>
  <text x="74" y="242" fill="#E2E8F0" font-size="11.5">• 捕获 #12光源腔 142kHz 压电边带致 1.42μm 抖动与 9.4° 靶倾角</text>
  <text x="74" y="260" fill="#34D399" font-size="11" font-weight="700">✓ 提前拦截转换效率暴跌 (CE=4.25%) 与高能锡离子非对称轰击!</text>

  <rect x="58" y="298" width="384" height="104" rx="10" fill="#132342" stroke="#0EA5E9" stroke-width="1.2"/>
  <text x="74" y="320" fill="#7DD3FC" font-size="12.5" font-weight="800">🪞 1,080 面 $8.5M 40层钼/硅 (Mo/Si) 布拉格收集镜</text>
  <text x="74" y="340" fill="#E2E8F0" font-size="11.5">• 远场 4 象限 EUV 能量探头 + 尾气甲锡烷 (SnH4) 质谱仪</text>
  <text x="74" y="358" fill="#E2E8F0" font-size="11.5">• 氢自由基清洗反应 (Sn + 4H* → SnH4↑) 实时抑制镜面锡沉积</text>
  <text x="74" y="376" fill="#34D399" font-size="11" font-weight="700">✓ 联合 Sub-Fab 钯膜纯化器实现 95.8% 9N 超高纯氢气闭环回收</text>

  <rect x="58" y="414" width="384" height="104" rx="10" fill="#132342" stroke="#10B981" stroke-width="1.2"/>
  <text x="74" y="436" fill="#6EE7B7" font-size="12.5" font-weight="800">🛡️ 2,400 个 45nm 悬空碳纳米管 (CNT) 光罩防尘膜工位</text>
  <text x="74" y="456" fill="#E2E8F0" font-size="11.5">• 高速红外热像仪监测 500W EUV 源功率下 CNT 薄膜热斑</text>
  <text x="74" y="474" fill="#E2E8F0" font-size="11.5">• 捕获 #07扫描台 CNT 中心温度升至 918.4°C (逼近 950°C 断裂线)</text>
  <text x="74" y="492" fill="#34D399" font-size="11" font-weight="700">✓ 严防 CNT 在真空腔内热破裂污染 $450K 极紫外光罩 (Reticle)</text>

  <rect x="58" y="530" width="384" height="102" rx="10" fill="#1F122B" stroke="#F43F5E" stroke-width="1.2"/>
  <text x="74" y="552" fill="#FDA4AF" font-size="12" font-weight="800">⛔ 传统孤立机台 FPGA 控制与云端全内存拼接栈痛点</text>
  <text x="74" y="572" fill="#FECDD3" font-size="11">• 单点 2D 转向镜看不见三维圆饼靶倾角，反而把锡碎屑引向收集镜</text>
  <text x="74" y="590" fill="#FECDD3" font-size="11">• 990K EPS 云端按属性写入税高达 $153.2K/月</text>
  <text x="74" y="608" fill="#FECDD3" font-size="11">• 2.68 亿向量全内存常驻需 3.00TB+ DRAM (&gt;$55.8K/月)</text>

