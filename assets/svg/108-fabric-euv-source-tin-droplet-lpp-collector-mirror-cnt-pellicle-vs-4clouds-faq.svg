  <text x="516" y="338" fill="#E2E8F0" font-size="11.5">• 百轮大关：检索 268,000,000 条 RMHD 双脉冲、氢吹扫与 CNT 散热向量</text>
  <text x="516" y="356" fill="#E2E8F0" font-size="11.5">• NVMe SSD 索引省 92% 内存 ($1.6K vs $55.8K/月)，余弦相似度 0.99</text>
  <text x="516" y="374" fill="#E2E8F0" font-size="11.5">• 输出：压电抑振 -18dB + 预脉冲 +1.35μm + 主脉冲 +85ns + 氢吹扫 +14.5%</text>
  <text x="516" y="394" fill="#34D399" font-size="11" font-weight="700">✓ 锡滴对准残差压至 0.18μm、CE 恢复 6.12%，CNT 降温至 784.0°C</text>

  <rect x="500" y="422" width="440" height="96" rx="10" fill="#0B1933" stroke="#F59E0B" stroke-width="1.3"/>
  <text x="516" y="444" fill="#FBBF24" font-size="12.5" font-weight="800">Step 3 · Foundry IQ 极紫外光源与防尘膜护栏 (SOP-107 · 13ms)</text>
  <text x="516" y="464" fill="#E2E8F0" font-size="11.5">• 校验对准残差 0.18μm &lt;= 0.35μm、转换效率 CE = 6.12% &gt;= 5.80%</text>
  <text x="516" y="482" fill="#E2E8F0" font-size="11.5">• 校验 CNT 防尘膜 784.0°C &lt;= 820.0°C 零破裂，9N 氢回收率 95.8%</text>
  <text x="516" y="500" fill="#34D399" font-size="11" font-weight="700">✓ 100% 阻断 $8.5M 收集镜锡剥落与 $450K 极紫外光罩颗粒污染</text>

  <rect x="500" y="530" width="440" height="102" rx="10" fill="#0B1933" stroke="#10B981" stroke-width="1.3"/>
  <text x="516" y="552" fill="#34D399" font-size="12.5" font-weight="800">Step 4 · Teams 总监确认 + ALDO Sub-Fab 边缘 &amp; SEMI S23 (13ms)</text>
  <text x="516" y="572" fill="#E2E8F0" font-size="11.5">• SQL on Azure Local (ALDO) 13ms 驱动压电转向镜、激光延迟与氢吹扫</text>
  <text x="516" y="590" fill="#E2E8F0" font-size="11.5">• 1GB 免费 Fabric SQL 签发 SEMI S23 95.8% 绿氢循环与收集镜寿命账本</text>
  <text x="516" y="610" fill="#34D399" font-size="11" font-weight="700">✓ 50ms 端到端闭环 (R100!) · 守护 $34.10M High-NA EUV 光刻 SLA</text>

