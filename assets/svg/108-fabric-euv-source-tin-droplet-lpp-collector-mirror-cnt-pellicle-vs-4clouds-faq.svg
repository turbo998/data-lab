  <rect x="500" y="182" width="440" height="102" rx="10" fill="#0B1933" stroke="#3B82F6" stroke-width="1.3"/>
  <text x="516" y="204" fill="#60A5FA" font-size="12.5" font-weight="800">Step 1 · Eventhouse KQL 12ms 声光互谱与靶倾角感知 ($0/GB)</text>
  <text x="516" y="224" fill="#E2E8F0" font-size="11.5">• 共享 F64 容量池内 $0/GB 写入税摄入 990,000 EPS 50kHz/光学流</text>
  <text x="516" y="242" fill="#E2E8F0" font-size="11.5">• series_fft() 12ms 锁定 #12腔 1.42μm / 9.4° 倾角与 #07台 918.4°C</text>
  <text x="516" y="262" fill="#34D399" font-size="11" font-weight="700">✓ 立省 $148.3K/月写入费，毫秒级反演三维圆饼靶非对称倾角</text>

  <rect x="500" y="296" width="440" height="114" rx="10" fill="#0B1933" stroke="#06B6D4" stroke-width="1.3"/>
