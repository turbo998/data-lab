  <text x="1014" y="540" fill="#E2E8F0" font-size="11">• 路由评估矩阵 (n=444)：443 / 444 (99.77%) · 均值 173.0 ms</text>
  <text x="1014" y="558" fill="#E2E8F0" font-size="11">• 本体仿真均值 (n=107)：156.0 ms (本场景 DC 仅 50 ms E2E!)</text>
  <text x="1014" y="576" fill="#E2E8F0" font-size="11">• 50kHz 双脉冲：残差 1.42→0.18μm | 转换效率 CE 4.25%→6.12%</text>
  <text x="1014" y="594" fill="#E2E8F0" font-size="11">• 光学与绿氢：CNT 784°C 零破裂 · 95.8% 9N-H2 钯膜闭环回收</text>
