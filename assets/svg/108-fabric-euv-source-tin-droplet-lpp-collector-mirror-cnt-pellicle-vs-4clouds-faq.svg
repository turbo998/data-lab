  <rect x="1014" y="378" width="42" height="14" rx="7" fill="#10B981"/>
  <text x="1066" y="390" fill="#34D399" font-size="12" font-weight="800">$14,100 / 月 (基准最优 · 省 93.6%)</text>

  <text x="1014" y="414" fill="#CBD5E1" font-size="11.5">四云拼接栈 (按属性写入 IoT + 3.00TB 全内存向量 + BI 席位)</text>
  <rect x="1014" y="422" width="340" height="14" rx="7" fill="#EF4444"/>
  <text x="1014" y="454" fill="#FCA5A5" font-size="11.5" font-weight="700">$220,400 / 月 (归一化) | $599,800 / 月 (全量内部栈)</text>
  <text x="1014" y="474" fill="#34D399" font-size="11.5" font-weight="800">★ 净省 $206,300 / 月 ($2.48M / 年) · 第 100 轮百轮大关里程碑!</text>

  <rect x="998" y="498" width="384" height="134" rx="10" fill="#132342" stroke="#F59E0B" stroke-width="1.4"/>
