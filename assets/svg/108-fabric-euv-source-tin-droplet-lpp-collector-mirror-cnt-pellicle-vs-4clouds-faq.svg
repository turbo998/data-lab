  <rect x="730" y="706" width="650" height="142" rx="10" fill="#091326" stroke="#1E293B" stroke-width="1.2"/>
  <text x="748" y="728" fill="#6EE7B7" font-size="12.5" font-weight="800">🛠️ 生产落地五大核验项 (Production Verification Checklist)</text>
  <text x="748" y="748" fill="#E2E8F0" font-size="11.5">☑ 1. 540 套光源腔 50kHz 锡滴双正交阴影流与远场 4 象限 EUV 探头直推 Eventhouse</text>
  <text x="748" y="766" fill="#E2E8F0" font-size="11.5">☑ 2. Mo/Si 收集镜分象限氢自由基 (H*→SnH4) 吹扫阀与尾气质谱 12ms 闭环联动</text>
  <text x="748" y="784" fill="#E2E8F0" font-size="11.5">☑ 3. Cosmos DB SSD DiskANN 2.68 亿条 RMHD/布拉格反射/CNT 散热索引 (-92% 内存，P95 &lt;= 12ms)</text>
